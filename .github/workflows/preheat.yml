# Backend Preheat — 后端预热脚本（D30 备份三件套 · 第一件）
#
# 作用：SnapDeploy 容器冷启动需要数秒；汇报当天若后端长时间未访问，
#       第一次打开链接会撞上冷启动。本 workflow 每 10 分钟 ping 一次
#       后端 /health，让容器保持热状态（或触发冷启动尽早完成）。
#
# 注意：
#   - cron 为 UTC；*/10 表示每 10 分钟一次（含汇报当天自动预热）
#   - 失败不报错（continue-on-error）：冷启动期间 ping 失败属正常，
#     下一轮会自动重试，直到容器就绪。
#   - 首次使用需确认仓库已启用 GitHub Actions（Settings → Actions → General）。
#   - 手动触发：仓库 Actions 页 → "Backend Preheat" → Run workflow。

name: Backend Preheat

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  preheat:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /health
        run: |
          echo "Pinging $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          if curl -sf --max-time 40 https://turbine-blade-api-c4f40.containers.snapdeploy.app/health; then
            echo "✅ Backend is warm"
          else
            echo "⏳ Backend sleeping/cold-starting — next cycle will ping again"
          fi
        continue-on-error: true
