  <script>window.PAGE_DATA = {"id": "u05", "kind": "unit", "title": "第 5 单元 · RANS、网格与残差收敛", "subtitle": "RANS、网格与残差收敛 · 本地学习", "intro": "本单元的「收敛」**只**指：离散 N-S 方程的残差降到阈值。不要和蒙特卡洛收敛、覆盖率校准收敛混用。\n\n---", "contentSections": [{"id": "section-5-1", "number": "5.1", "title": "CFD 与 RANS", "content": "**CFD**（Computational Fluid Dynamics）：在网格上数值求解流体力学方程。\n\n**N-S 方程**：质量、动量、能量守恒，加上本构（牛顿流体等）。直接解所有湍流尺度叫 DNS，工程上太贵。\n\n**RANS**（Reynolds-Averaged Navier–Stokes）：对 N-S 做时间平均，脉动的影响收进雷诺应力，再用湍流模型封闭。PLAID 的标签和你们打算跑的 SU2，都是 RANS 这一档。常见封闭：Spalart–Allmaras（SA）、\\(k\\)-\\(\\omega\\) SST。\n\nRANS 给出的是**平均场**，不是每一瞬间的涡。激波在平均场里仍在，但非定常抖可能被抹掉。\n\n本项目 **没有** 自己产出可用的收敛 RANS 标签。1000 组真值来自 PLAID。我们的 SU2 是后来补的求解器通路。\n\n---"}, {"id": "section-5-2", "number": "5.2", "title": "网格", "content": "连续的通道被切成单元。表面大约 **29,773** 个节点（本数据集）。体积网格另算。\n\n| 本项目网格 | 规模 | 格式 / 格式意图 | 结果 |\n|---|---|---|---|\n| 粗 | 约 14 万单元 | 一阶迎风 | \\(\\mathrm{relrms}=-3.39\\)，`converged=false`，E3 |\n| 细 | 约 355 万（审计：3,557,497 节点量级） | 二阶意图 | 本机内存不够，没跑完。不是 E4 |\n\n**一阶迎风**：数值耗散大，激波和剪切层会被抹宽。所以粗网格连「趋势」都要加引号。  \n**二阶**：更少耗散，更易在激波处振荡，需要限制器；没收敛时数字不能用。\n\n网格质量：非正交、负体积、非流形边，都会让求解器哭。审计里写过点云 0 非流形边——那是几何检查，不是流场收敛。\n\n---"}, {"id": "section-5-3", "number": "5.3", "title": "残差收敛的操作定义", "content": "迭代求解时，把离散方程的不平衡叫**残差**。相对残差常用对数：\n\n\\[\n\\mathrm{relrms}=\\log_{10}\\frac{\\|\\mathbf{R}^{(k)}\\|}{\\|\\mathbf{R}^{(0)}\\|}\n\\]\n\n工程上常希望到 \\(-6\\) 量级（残差掉六个数量级），并且进出口流量守恒、性能系数稳住。\n\n\\(-3.39\\) 的意思：残差只掉了约 \\(10^{-3.39}\\approx 4\\times 10^{-4}\\) 倍，离 \\(10^{-6}\\) 还远，而且日志给的是平台——掉不动了。所以 **未收敛**。\n\n未收敛的场：激波位置可以还在漂，\\(\\eta\\) 可以还在晃。用它给 Pareto 点「验一下」会得到一个随机数，不能填进决策指标。\n\n宪章：`decision_metrics` 在收敛 RANS 对照前一律 null。禁止用代理自比填 Spearman。"}], "sections": [{"id": "practice-1", "title": "练习 1"}, {"id": "practice-2", "title": "练习 2"}, {"id": "practice-3", "title": "练习 3"}, {"id": "unit-test", "title": "单元卷"}], "questions": [{"id": "U05-S1-Q01", "section": "practice-1", "number": "Q01", "difficulty": "easy", "type": "choice", "stem": "RANS 平均的是", "options": ["A. 空间", "B. 时间", "C. 只平均压力", "D. 不平均"], "answer": "B", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U05-S1-Q02", "section": "practice-1", "number": "Q02", "difficulty": "easy", "type": "choice", "stem": "PLAID 标签是", "options": ["A. 本实验室实验", "B. 公开 RANS", "C. 我们收敛的 SU2", "D. DNS"], "answer": "B", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U05-S1-Q03", "section": "practice-1", "number": "Q03", "difficulty": "medium", "type": "fill", "stem": "CFD 四词英文：______。", "options": null, "answer": "Computational Fluid Dynamics", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U05-S1-Q04", "section": "practice-1", "number": "Q04", "difficulty": "medium", "type": "fill", "stem": "尺度从细到粗：DNS > ______ > RANS。", "options": null, "answer": "LES", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U05-S1-Q05", "section": "practice-1", "number": "Q05", "difficulty": "medium", "type": "short", "stem": "雷诺应力为何需要模型？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U05-S1-Q06", "section": "practice-1", "number": "Q06", "difficulty": "medium", "type": "short", "stem": "我们自己有没有可用的收敛 RANS 标签？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U05-S1-Q07", "section": "practice-1", "number": "Q07", "difficulty": "medium", "type": "short", "stem": "SA 是几方程模型？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U05-S1-Q08", "section": "practice-1", "number": "Q08", "difficulty": "medium", "type": "short", "stem": "RANS 平均场里还能看见激波吗？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U05-S1-Q09", "section": "practice-1", "number": "Q09", "difficulty": "medium", "type": "short", "stem": "改错：「我们用 PINN 解了 N-S。」", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U05-S1-Q10", "section": "practice-1", "number": "Q10", "difficulty": "hard", "type": "short", "stem": "跨音速转子上 RANS 的 η 为何对模型和网格敏感？", "options": null, "answer": "对照本节教材正文作 ": "U05-S2-Q10", "section": "practice-2", "number": "Q10", "difficulty": "hard", "type": "short", "stem": "只能跑粗网格时，怎样设计对照才不把 −3.39 当验证？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U05-S3-Q01", "section": "practice-3", "number": "Q01", "difficulty": "easy", "type": "choice", "stem": "relrms=−3.39", "options": ["A. 已收敛", "B. 未收敛", "C. 误差 3.39%", "D. E4"], "answer": "B", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U05-S3-Q02", "section": "practice-3", "number": "Q02", "difficulty": "easy", "type": "choice", "stem": "工程上常希望 relrms 到", "options": ["A. −1", "B. −3.39", "C. −6 量级", "D. +2"], "answer": "C", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U05-S3-Q03", "section": "practice-3", "number": "Q03", "difficulty": "medium", "type": "fill", "stem": "\\(\\mathrm{relrms}=\\log_{10}\\)______。", "options": null, "answer": "\\(\\|R^k\\|/\\|R^0\\|\\)", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U05-S3-Q04", "section": "practice-3", "number": "Q04", "difficulty": "medium", "type": "fill", "stem": "决策指标在收敛 RANS 前必须保持 ______。", "options": null, "answer": "null", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U05-S3-Q05", "section": "practice-3", "number": "Q05", "difficulty": "medium", "type": "short", "stem": "「平台」意味着什么？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U05-S3-Q06", "section": "practice-3", "number": "Q06", "difficulty": "medium", "type": "short", "stem": "除残差外还要看哪两个工程判据？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U05-S3-Q07", "section": "practice-3", "number": "Q07", "difficulty": "medium", "type": "short", "stem": "未收敛时激波位置可能怎样？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U05-S3-Q08", "section": "practice-3", "number": "Q08", "difficulty": "medium", "type": "short", "stem": "三种收敛各用四个字区分。", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U05-S3-Q09"
