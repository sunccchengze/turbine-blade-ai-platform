  <script>window.PAGE_DATA = {"id": "u09", "kind": "unit", "title": "第 9 单元 · MC Dropout 拆解", "subtitle": "MC Dropout 拆解 · 本地学习", "intro": "对照图：`docs/lecture-figs/q4-mc-dropout-mechanism.svg`，讲义：`docs/teachback-Q4-MC-Dropout.md`。  \n本单元只拆到「\\(\\mu,\\sigma\\) 怎么来」。覆盖率与加宽在 U10。\n\n---", "contentSections": [{"id": "section-9-1", "number": "9.1", "title": "拆词", "content": "**Monte Carlo**：用随机抽样逼近很难直接积的量。\\(T\\to\\infty\\) 时样本均值收敛到期望。这是 **MC 估计量收敛**。\n\n**Dropout**（Srivastava 2014）：训练时以概率 \\(p\\) 把激活乘 0。权重还在磁盘上。\n\n**MC Dropout**（Gal & Ghahramani, ICML 2016）：推理时也不关 Dropout，同一 \\(x\\) 前向 \\(T\\) 次，每次换面具。\\(T\\) 个输出的均值当预测，标准差当不确定度。论文包装：Bernoulli 变分分布上的蒙特卡洛积分。包装可以后懂。\n\n法定名称：heuristic uncertainty band。不是校准的 95% CI。\n\n---"}, {"id": "section-9-2", "number": "9.2", "title": "操作（对着残差网）", "content": "\\(p=0.1\\)，\\(T=100\\)。\n\n```\nfor t = 1 … 100:\n    z^(t) ~ Bernoulli(0.9)   # 该 Dropout 的位置独立抽\n    y^(t) = f(x ; θ ⊙ z^(t))\nμ = mean(y^(t));  σ = std(y^(t))\n```\n\n常规推理 `eval()` 关 Dropout，一点定死。  \n生产 ONNX **没有** Dropout：`predict_with_uncertainty` 用训练期平均 \\(\\sigma\\) 常数表（π 0.006393，η 0.001007，ṁ 0.061055）。`n_mc_samples` 不生效。\n\n---"}, {"id": "section-9-3", "number": "9.3", "title": "公式", "content": "\\[\n\\mu(x)=\\frac1T\\sum_t y^{(t)}(x),\\quad\n\\sigma(x)=\\sqrt{\\frac1{T-1}\\sum_t(y^{(t)}-\\mu)^2}\n\\]\n\n名义带：\\(\\mu\\pm 1.96\\sigma\\)。1.96 是标准正态 0.975 分位数，**假定** \\((y-\\mu)/\\sigma\\sim\\mathcal N(0,1)\\) 且 \\(\\sigma\\) 没有系统性偏小。\n\n\\(\\mathrm{SE}(\\mu)=\\sigma/\\sqrt{T}\\)。\\(T=100\\) 时约 \\(0.1\\sigma\\)。采样次数已经够。覆盖率失败不是 \\(T\\) 太小。\n\nDropout 只扰动有效权重 = **认知不确定**（epistemic）。不建模数据本身的跳（偶然 / aleatoric），除非另做异方差头。Gal 的变分族窄，常低估宽度。\n\nfig14：\\(\\eta\\) 上 \\(\\sigma\\) 与 \\(|\\mathrm{err}|\\) 相关约 **0.027**。带宽几乎不跟踪谁更难。"}], "sections": [{"id": "practice-1", "title": "练习 1"}, {"id": "practice-2", "title": "练习 2"}, {"id": "practice-3", "title": "练习 3"}, {"id": "unit-test", "title": "单元卷"}], "questions": [{"id": "U09-S1-Q01", "section": "practice-1", "number": "Q01", "difficulty": "easy", "type": "choice", "stem": "Dropout 乘 0 的是", "options": ["A. 磁盘上的 \\(W\\)", "B. 激活", "C. 标签", "D. 网格"], "answer": "B", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U09-S1-Q02", "section": "practice-1", "number": "Q02", "difficulty": "easy", "type": "choice", "stem": "MC Dropout 论文", "options": ["A. He 2016", "B. Gal & Ghahramani 2016", "C. Deb 2002", "D. Reid 1978"], "answer": "B", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U09-S1-Q03", "section": "practice-1", "number": "Q03", "difficulty": "medium", "type": "fill", "stem": "M 是______，C 是同一词的后半，Dropout 做______。", "options": null, "answer": "Monte；Carlo；随机置零激活", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U09-S1-Q04", "section": "practice-1", "number": "Q04", "difficulty": "medium", "type": "fill", "stem": "法定名称：______ band（启发式不确定带）。", "options": null, "answer": "heuristic", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U09-S1-Q05", "section": "practice-1", "number": "Q05", "difficulty": "medium", "type": "short", "stem": "有效权重是什么意思？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U09-S1-Q06", "section": "practice-1", "number": "Q06", "difficulty": "medium", "type": "short", "stem": "Gal 2016 的包装一句话。", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U09-S1-Q07", "section": "practice-1", "number": "Q07", "difficulty": "medium", "type": "short", "stem": "为何不叫校准 95% CI？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U09-S1-Q08", "section": "practice-1", "number": "Q08", "difficulty": "medium", "type": "short", "stem": "MC 估计量收敛的判据。", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U09-S1-Q09", "section": "practice-1", "number": "Q09", "difficulty": "medium", "type": "short", "stem": "改错：「Dropout 把权重从磁盘删掉。」", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U09-S1-Q10", "section": "practice-1", "number": "Q10", "diffi ion": "practice-2", "number": "Q09", "difficulty": "medium", "type": "short", "stem": "改错：「网页上每个点都抽了 100 次。」", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U09-S2-Q10", "section": "practice-2", "number": "Q10", "difficulty": "hard", "type": "short", "stem": "常数 σ 带和逐点 σ(x) 对主动学习各有何后果？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U09-S3-Q01", "section": "practice-3", "number": "Q01", "difficulty": "easy", "type": "choice", "stem": "1.96 来自", "options": ["A. 覆盖率实测", "B. 标准正态 0.975 分位", "C. p=0.1", "D. T=100"], "answer": "B", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U09-S3-Q02", "section": "practice-3", "number": "Q02", "difficulty": "easy", "type": "choice", "stem": "fig14 上 η 的 r 约", "options": ["A. 0.98", "B. 0.65", "C. 0.027", "D. 1.96"], "answer": "C", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U09-S3-Q03", "section": "practice-3", "number": "Q03", "difficulty": "medium", "type": "fill", "stem": "\\(\\mathrm{SE}(\\mu)=\\sigma/\\sqrt{T}\\)，T=100 时约 ______ σ。", "options": null, "answer": "0.1", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U09-S3-Q04", "section": "practice-3", "number": "Q04", "difficulty": "medium", "type": "fill", "stem": "\\(\\bar\\sigma_\\eta=0.0010\\) 相对带宽 0.045，比例约 ______%。", "options": null, "answer": "2", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U09-S3-Q05", "section": "practice-3", "number": "Q05", "difficulty": "medium", "type": "short", "stem": "两个高斯前提是什么？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U09-S3-Q06", "section": "practice-3", "number": "Q06", "difficulty": "medium", "type": "short", "stem": "epistemic vs aleatoric。", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U09-S3-Q07", "section": "practice-3", "number": "Q07", "difficulty": "medium", "type": "short", "stem": "窄变分为何低估？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": "
