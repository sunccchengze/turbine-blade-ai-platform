  <script>window.PAGE_DATA = {"id": "u07", "kind": "unit", "title": "第 7 单元 · 残差代理与损失", "subtitle": "残差代理与损失 · 本地学习", "intro": "对象：`notebooks/04_residual_physics_model.ipynb` 里的网。约 **523,011** 参数，ONNX 约 **2.11 MB**。\n\n---", "contentSections": [{"id": "section-7-1", "number": "7.1", "title": "代理是一个函数", "content": "**代理模型**（surrogate）：用便宜的 \\(f_\\theta(x)\\) 近似昂贵的仿真 \\(y=\\mathrm{CFD}(x)\\)。  \n这里 \\(x\\in\\mathbb{R}^{74}\\)，\\(y\\in\\mathbb{R}^3=(\\pi,\\eta,\\dot m)\\)。\n\n**神经元**：一层里的一个标量。线性 \\(w\\cdot h+b\\) 再加非线性。  \n**ReLU**：\\(\\mathrm{ReLU}(z)=\\max(z,0)\\)。整网是分段线性连续函数。  \n**权重**：所有 \\(W,b\\)。训练改它们。  \n**前向**：给定 \\(x\\) 和当前权重，算出 \\(y\\)。  \n**反向 / 梯度**：损失对权重的导数，Adam 沿着它走。\n\n过拟合：训练误差远小于测试误差。本项目 train \\(R^2\\) 可到 0.99，测试 0.96 档，差距要诚实公开。\n\n---"}, {"id": "section-7-2", "number": "7.2", "title": "残差块与 Dropout（训练期）", "content": "残差块（He et al., 2016）：\n\n\\[\nx \\mapsto \\mathrm{ReLU}\\big(F(x)+x\\big)\n\\]\n\n\\(F\\) 里：Linear → BN → ReLU → Dropout(0.1) → Linear → BN。  \n捷径让梯度能抄近路；最差 \\(F\\approx 0\\)，块退化成恒等。\n\n整网：\n\n```\n74 → 256 + BN + ReLU + Dropout(0.1)\n   → ResidualBlock ×3 (256)\n   → 128 + BN + ReLU + Dropout(0.1)\n   → ResidualBlock ×2 (128)\n   → 3\n```\n\n**Dropout（训练）**：每个激活以 \\(p=0.1\\) 乘 0，留下的除以 \\(0.9\\)。这是正则，逼网络不要只靠某几个神经元。推理默认关掉（`eval()`）。MC Dropout 是以后故意不关，见 U09。\n\nBatchNorm：用当前 batch 的均值方差标准化，再学缩放平移。训练和推理统计量不同，和 Dropout 一起开着做 MC 时会有争议——知道有此事即可。\n\n---"}, {"id": "section-7-3", "number": "7.3", "title": "损失：加权 MSE + 边界惩罚，不是 PINN", "content": "\\[\nL=\\sum_{i\\in\\{\\pi,\\eta,\\dot m\\}} w_i\\,\\mathrm{MSE}_i +\\lambda\\sum_j \\big(\\mathrm{ReLU}(g_j)\\big)^2\n\\]\n\n\\(w=(1,3,1.5)\\)，\\(\\lambda=0.1\\)。\\(g_j\\) 是越界量：\\(\\eta>1\\)、\\(\\eta<0.5\\)、\\(\\pi<1\\)、\\(\\dot m<0\\)。\n\n**PINN**：把微分方程残差（例如 N-S）加进损失，在配点上罚 \\(\\|\\mathcal{N}[u]\\|\\)。  \n本项目**没有**在配点上算 N-S。ReLU² 只是把输出按进盒子。信里必须说「不是 PINN」。\n\n优化器 Adam，lr \\(10^{-3}\\)，weight decay \\(10^{-4}\\)，余弦退火，早停耐心 40。这些是训练超参，不是物理。"}], "sections": [{"id": "practice-1", "title": "练习 1"}, {"id": "practice-2", "title": "练习 2"}, {"id": "practice-3", "title": "练习 3"}, {"id": "unit-test", "title": "单元卷"}], "questions": [{"id": "U07-S1-Q01", "section": "practice-1", "number": "Q01", "difficulty": "easy", "type": "choice", "stem": "代理输入输出维", "options": ["A. 3→74", "B. 74→3", "C. 29773→3", "D. 74→74"], "answer": "B", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U07-S1-Q02", "section": "practice-1", "number": "Q02", "difficulty": "easy", "type": "choice", "stem": "ReLU 是", "options": ["A. \\(\\max(z,0)\\)", "B. \\(1/(1+e^{-z})\\)", "C. \\(z^2\\)", "D. \\(\\tanh z\\)"], "answer": "A", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U07-S1-Q03", "section": "practice-1", "number": "Q03", "difficulty": "medium", "type": "fill", "stem": "参数量约 ______；ONNX 约 ______ MB。", "options": null, "answer": "523011；2.11", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U07-S1-Q04", "section": "practice-1", "number": "Q04", "difficulty": "medium", "type": "fill", "stem": "过拟合迹象：train \\(R^2\\) 可到 ______，测试约 ______ 档。", "options": null, "answer": "0.99；0.96", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U07-S1-Q05", "section": "practice-1", "number": "Q05", "difficulty": "medium", "type": "short", "stem": "分段线性连续对 η「跳」为什么不友好？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U07-S1-Q06", "section": "practice-1", "number": "Q06", "difficulty": "medium", "type": "short", "stem": "前向和反向各干什么？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U07-S1-Q07", "section": "practice-1", "number": "Q07", "difficulty": "medium", "type": "short", "stem": "ONNX 相对 PyTorch 的部署意义？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U07-S1-Q08", "section": "practice-1", "number": "Q08", "difficulty": "medium", "type": "short", "stem": "\\(f_\\theta\\) 近似的是谁的 CFD？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U07-S1-Q09", "section": "practice-1", "number": "Q09
