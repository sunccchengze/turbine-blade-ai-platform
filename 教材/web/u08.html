  <script>window.PAGE_DATA = {"id": "u08", "kind": "unit", "title": "第 8 单元 · \\(R^2\\)、划分与「优化不可靠」", "subtitle": "R²、划分与优化不可靠 · 本地学习", "intro": "Q2 的正课。\\(R^2=0.98\\) 仍然不能说优化可靠。\n\n---", "contentSections": [{"id": "section-8-1", "number": "8.1", "title": "\\(R^2\\) 量的是什么", "content": "\\[\nR^2=1-\\frac{\\sum_i(y_i-\\hat y_i)^2}{\\sum_i(y_i-\\bar y)^2}\n\\]\n\n分子：预测残差平方和。分母：相对均值的总变差。  \n\\(R^2=1\\) 完美拟合；\\(R^2=0\\) 和猜均值一样糟；可以是负的。\n\n它是**平均拟合**。100 个点里 95 个极准、5 个在流形边上炸，平均仍可很高。优化偏偏爱往边上走。\n\nMAE：\\(\\frac1n\\sum|y-\\hat y|\\)，带原单位。\\(\\eta\\) 的 MAE 约 \\(10^{-3}\\) 量级（页上曾写 0.0031 一类，以复现脚本为准）。\n\n---"}, {"id": "section-8-2", "number": "8.2", "title": "划分", "content": "本项目：`train_test_split`，800 / 100 / 100，seed=42。这是**随机留出**，工程开发划分。\n\n不是：\n\n- PLAID 官方 test 200（标签隐藏）  \n- 按几何家族、按叶尖马赫、按近堵塞 / 近失速分层  \n- 多种子平均\n\n所以：\\(R^2\\) 证明「在同分布随机抽的 100 点上拟合好」，不证明「换一族叶子还好」，更不证明「Pareto 边上还好」。\n\n训练集内部最近邻中位距离约 6.1（标准化空间），Pareto 到训练集最近邻约 17.4，约 **3×**。前沿在流形边缘，+5.4% 更像外推。\n\n---"}, {"id": "section-8-3", "number": "8.3", "title": "排序错了会怎样", "content": "优化要的不是平均 \\(R^2\\)，是**排序**：谁该进 Top-k 去跑贵的 RANS。\n\n学长点名、现在全是 null 的决策指标：\n\n| 指标 | 问的是 |\n|---|---|\n| Spearman / Kendall | 代理排序和 CFD 排序是否同调 |\n| Top-k Recall | 真前 k 里有几个被模型前 k 抓住 |\n| Feasibility Precision | 说可行的有多少真可行 |\n| Pareto HV Error | 代理前沿相对 CFD 前沿的超体积误差 |\n| Optimization Regret | 按代理选的点，CFD 上后悔多少 |\n| CFD Budget Saved | 相对随机/全算，省了多少次真计算 |\n\n没有收敛 RANS 对照，用代理自己和自己比来填这些数，叫做伪造。优化页上曾经出现过随代数线性涨的假 HV，已经改成破折号。"}], "sections": [{"id": "practice-1", "title": "练习 1"}, {"id": "practice-2", "title": "练习 2"}, {"id": "practice-3", "title": "练习 3"}, {"id": "unit-test", "title": "单元卷"}], "questions": [{"id": "U08-S1-Q01", "section": "practice-1", "number": "Q01", "difficulty": "easy", "type": "choice", "stem": "\\(R^2=0\\) 表示", "options": ["A. 完美", "B. 和猜均值一样糟", "C. 一定为负", "D. 优化可靠"], "answer": "B", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U08-S1-Q02", "section": "practice-1", "number": "Q02", "difficulty": "easy", "type": "choice", "stem": "冻住的
