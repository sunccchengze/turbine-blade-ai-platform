  <script>window.PAGE_DATA = {"id": "final-a", "kind": "exam", "title": "期末综合检测 A 卷", "subtitle": "40 题 · 2:2:6", "info": "闭卷 120 分钟。40 题。**8 选 + 8 填 + 24 问**（2:2:6）。易 8 · 中 28 · 难 4。", "questions": [{"id": "A01", "section": "all", "number": "A01", "difficulty": "easy", "type": "choice", "stem": "Rotor 37 是", "options": ["A. 涡轮叶片", "B. 跨音速压气机转子", "C. 涡扇整机", "D. KIT 氢燃机"], "answer": "B", "explanation": "跨音速压气机转子，不是涡轮。"}, {"id": "A02", "section": "all", "number": "A02", "difficulty": "easy", "type": "choice", "stem": "冻住的 η 的 \\(R^2\\)", "options": ["A. 0.9844", "B. 0.9561", "C. 0.9827", "D. 0.9173"], "answer": "B", "explanation": "冻住 η 的 R² 是 0.9561。0.9173 是代理最高效率，不是 R²。"}, {"id": "A03", "section": "all", "number": "A03", "difficulty": "easy", "type": "choice", "stem": "\\(\\hat C_\\eta=\\)", "options": ["A. 0.95", "B. 0.89", "C. 0.65", "D. 0.88"], "answer": "C", "explanation": "Ĉ_η=0.65。"}, {"id": "A04", "section": "all", "number": "A04", "difficulty": "easy", "type": "choice", "stem": "relrms=−3.39", "options": ["A. 已收敛", "B. 未收敛", "C. 误差 3.39%", "D. E4"], "answer": "B", "explanation": "未收敛，E3。"}, {"id": "A05", "section": "all", "number": "A05", "difficulty": "easy", "type": "choice", "stem": "站名", "options": ["A. MDO 平台", "B. 气动代理筛选站", "C. 可制造优化站", "D. TNO 平台"], "answer": "B", "explanation": "气动代理筛选站。"}, {"id": "A06", "section": "all", "number": "A06", "difficulty": "easy", "type": "choice", "stem": "决策指标现在", "options": ["A. 已填 Spearman", "B. 全部 null", "C. 只有 HV", "D. 代理自比填过"], "answer": "B", "explanation": "决策指标全部 null。"}, {"id": "A07", "section": "all", "number": "A07", "difficulty": "medium", "type": "choice", "stem": "\\(P\\) 是", "options": ["A. 进口总压", "B. 背压", "C. 叶面静压均值", "D. 总温"], "answer": "B", "explanation": "P 是背压，不是进口总压。"}, {"id": "A08", "section": "all", "number": "A08", "difficulty": "medium", "type": "choice", "stem": "生产端 UQ", "options": ["A. 实时 100 次 Dropout", "B. 预计算常数 σ", "C. 已冻结 conformal", "D. 不用 σ"], "answer": "B", "explanation": "生产端预计算常数 σ。"}, {"id": "A09", "section": "all", "number": "A09", "difficulty": "easy", "type": "fill", "stem": "三个输出符号：______、______、______。", "options": null, "answer": "π、η、ṁ", "explanation": "三个气动输出。"}, {"id": "A10", "section": "all", "number": "A10", "difficulty": "easy", "type": "fill", "stem": "74 = ______×______ + Ω + P。", "options": null, "answer": "9×8", "explanation": "9 组表面场量 × 8 个统计量 + Ω + P，不是 9 个截面。"}, {"id": "A11", "section": "all", "number": "A11", "difficulty": "medium", "type": "fill", "stem": "\\(\\Omega\\) 单位必须是 ______。", "options": null, "answer": "rad/s", "explanation": ""}, {"id": "A12", "section": "all", "number": "A12", "difficulty": "medium", "type": "fill", "stem": "叶尖 \\(M_\\mathrm{rel}\\approx\\)______（公开基准）。", "options": null, "answer": "1.48", "explanation": "公开基准设计值，不是我们的 E4。"}, {"id": "A13", "section": "all", "number": "A13", "difficulty": "medium", "type": "fill", "stem": "八统计量里是 **std** 不是 ______。", "options": null, "answer": "方差", "explanation": "八个数里是 std。"}, {"id": "A14", "section": "all", "number": "A14", "difficulty": "medium", "type": "fill", "stem": "名义带：μ ± ______ σ。", "options": null, "answer": "1.96", "explanation": ""}, {"id": "A15", "section": "all", "number": "A15", "difficulty": "medium", "type": "fill", "stem": "\\(q>1.96\\) 叫 ______。", "options": null, "answer": "加宽", "explanation": "教材里 q>1.96 指保形把 1.96 换成更大的分位数 q，叫加宽。不是「离群」这个叫法。"}, {"id": "A16", "section": "all", "number": "A16", "difficulty": "medium", "type": "fill", "stem": "\\(\\dot m_\\max\\approx\\)______ kg/s，该点 η≈______。", "options": null, "answer": "21.74；0.873", "explanation": "冻住的是 21.74 kg/s @ η≈0.873，不是 20.93/0.842。"}, {"id": "A17", "section": "all", "number": "A17", "difficulty": "medium", "type": "short", "stem": "总压和静压差在哪个思想实验？", "options": null, "answer": "把气等熵刹到静止，压力变成总压；静压是当地热力学压力。", "explanation": ""}, {"id": "A18", "section": "all", "number": "A18", "difficulty": "medium", "type": "short", "stem": "等熵效率为什么 \\(\\le 1\\)。", "options": null, "answer": "实际有损失，焓升更大；热力学第二定律禁止 η>1。", "explanation": ""}, {"id": "A19", "section": "all", "number": "A19", "difficulty": "medium", "type": "short", "stem": "正激波后马赫数大于还是小于 1？", "options": null, "answer": "小于 1。", "explanation": ""}, {"id": "A20", "section": "all", "number": "A20", "difficulty": "medium", "type": "short", "stem": "无滑移条件。", "options": null, "answer": "壁面速度为 0。", "explanation": ""}, {"id": "A21", "section": "all", "number": "A21", "difficulty": "medium", "type": "short", "stem": "喉部在哪。", "options": null, "answer": "相邻叶片通道最窄截面。", "explanation": ""}, {"id": "A22", "section": "all", "number": "A22", "difficulty": "medium", "type": "short", "stem": "三种收敛各举本项目现状。", "options": null, "answer": "MC 估计量：T=100 够稳。覆盖率校准：η 只有 65%。RANS 残差：−3.39 未收敛。", "explanation": ""}, {"id": "A23", "section": "all", "number": "A23", "difficulty": "medium", "type": "short", "stem": "偏度为什么不是激波位置。", "options": null, "answer": "偏度是全局一个数，不含激波弦向/叶高位置。", "explanation": ""}, {"id": "A24", "section": "all", "number": "A24", "difficulty": "medium", "type": "short", "stem": "残差块写 \\(F(x)+x\\) 的意义。", "options": null, "answer": "学增量 F(x)；捷径让梯度抄近路，最差退成恒等。", "explanation": ""}, {"id": "A25", "section": "all", "number": "A25", "difficulty": "medium", "type": "short", "stem": "边界惩罚为什么不是 PINN。", "options": null, "answer": "PINN 要把 PDE 残差写进损失。本项目只有输出边界 ReLU²，不是 PINN。", "explanation": ""}, {"id": "A26", "section": "all", "number": "A26", "difficulty": "medium", "type": "short", "stem": "\\(R^2\\) 高为什么优化仍不可靠。", "options": null, "answer": "R² 是平均拟合。优化往流形边上走，排序可以对错。没有收敛 CFD，优化不可靠。", "explanation": ""}, {"id": "A27", "section": "all", "number": "A27", "difficulty": "medium", "type": "short", "stem": "流形 3× 的两个距离。", "options": null, "answer": "Pareto 到训练集最近邻中位距离约 17.4，训练集内部约 6.1，约 3×。不是「欧氏 vs 测地」那套空讲。", "explanation": ""}, {"id": "A28", "section": "all", "number": "A28", "difficulty": "medium", "type": "short", "stem": "Dropout 乘 0 的是什么？", "options": null, "answer": "激活，不是把权重从磁盘删掉。", "explanation": ""}, {"id": "A29", "section": "all", "number": "A29", "difficulty": "medium", "type": "short", "stem": "覆盖率公式（经验）。", "options": null, "answer": "Ĉ=(1/N)Σ 1{y_i ∈ [μ_i±1.96σ_i]}。", "explanation": ""}, {"id": "A30", "section": "all", "number": "A30", "difficulty": "medium", "type": "short", "stem": "保形不补什么（至少两点）。", "options": null, "answer": "不补激波物理、不补点排序（r≈0.027）、不保证分布漂移（Pareto 3×）下仍覆盖。", "explanation": ""}, {"id": "A31", "section": "all", "number": "A31", "difficulty": "medium", "type": "short", "stem": "0.9173 必须带的限定。", "options": null, "answer": "代理；相对训练均值；不是 CFD 叶片。", "explanation": ""}, {"id": "A32", "section": "all", "number": "A32", "difficulty": "medium", "type": "short", "stem": "3D 是示意还是 CAD？", "options": null, "answer": "示意重构，不是 CAD。", "explanation": ""}, {"id": "A33", "section": "all", "number": "A33", "difficulty": "medium", "type": "short", "stem": "为什么不叫 MDO。", "options": null, "answer": "只有气动标量，结构/热没接。", "explanation": ""}, {"id": "A34", "section": "all", "number": "A34", "difficulty": "medium", "type": "short", "stem": "Level 2 三块铁证。", "options": null, "answer": "①真实几何旋钮 CST/FFD；②Top-k 收敛 RANS 与排名对比；③一次主动学习或 abstain。", "explanation": ""}, {"id": "A35", "section": "all", "number": "A35", "difficulty": "medium", "type": "short", "stem": "2018 SMO 和 2025 TNO 各一句话。", "options": null, "answer": "2018 SMO：与 Haftka 的多保真选数据集。2025 TNO：Rotor 37 子午面先报 T,p,ρ 再报性能。", "explanation": ""}, {"id": "A36", "section": "all", "number": "A36", "difficulty": "medium", "type": "short", "stem": "改错：「校准的 95% CI，η 盖住 65%。」", "options": null, "answer": "改为：名义 95% 启发式带，η 经验覆盖约 65%，未校准。", "explanation": ""}, {"id": "A37", "section": "all", "number": "A37", "difficulty": "hard", "type": "short", "stem": "用权重 / 覆盖率 / 加宽写三句（Q4）。", "options": null, "answer": "Dropout 改的是有效权重；65% 是覆盖率不是分数；保形用 q 加宽区间，不补激波物理。", "explanation": ""}, {"id": "A38", "section": "all", "number": "A38", "difficulty": "hard", "type": "short", "stem": "「这是不是已经优化出好叶子？」三句以内。", "options": null, "answer": "不是。0.9173 是特征空间里代理吐的数；没有 CST/FFD，也没有收敛 RANS。", "explanation": ""}, {"id": "A39", "section": "all", "number": "A39", "difficulty": "hard", "type": "short", "stem": "从激波位置被 74 维抹掉推到 \\(\\hat C_\\eta=0.65\\)，不少于四步，每步标档。", "options": null, "answer": "[E1] 74 维丢掉激波位置 → [E1] 多对一 → [E2] 平滑网贴间断、σ 偏小 → [E2] Ĉ_η=0.65。", "explanation": ""}, {"id": "A40", "section": "all", "number": "A40", "difficulty": "hard", "type": "short", "stem": "第一轮 8 个收敛 RANS 的取样表，并指出哪些决策指标能填。", "options": null, "answer": "高 η 低 σ / 高 η 高 σ / 普通对照。能填很糙的 Spearman/Top-k；无收敛前 HV/Budget 仍空。", "explanation": ""}]};</script>
