  <script>window.PAGE_DATA = {"id": "u10", "kind": "unit", "title": "第 10 单元 · 覆盖率与保形加宽", "subtitle": "覆盖率与保形加宽 · 本地学习", "intro": "Q4 的收口。关键词：**权重、覆盖率、加宽**。三种收敛在这里并排钉死。\n\n---", "contentSections": [{"id": "section-10-1", "number": "10.1", "title": "经验覆盖率", "content": "名义区间 \\(I(x)=[\\mu-1.96\\sigma,\\mu+1.96\\sigma]\\)。留出集 \\(N=100\\)：\n\n\\[\n\\hat C=\\frac1N\\sum_{i=1}^N\\mathbf{1}\\{y_i\\in I(x_i)\\}\n\\]\n\n冻住：\\(\\pi:0.89\\)，\\(\\eta:0.65\\)，\\(\\dot m:0.88\\)。  \n\\(\\hat C_\\eta=0.65\\)：100 个真值里 65 个落在各自带子里，35 个在外面。不是「模型 65 分」。\n\n**覆盖率校准收敛**：同分布新样本上 \\(\\hat C\\to 1-\\alpha\\)（这里 \\(1-\\alpha=0.95\\)）。没有发生。\n\n\\(\\eta\\) 最差，三件事叠：物理上 SWBLI 接近间断；表示上 74 维丢掉激波位置；方法上 Dropout 只抖有效权重，\\(\\bar\\sigma_\\eta=0.0010\\) 偏小。\n\n---"}, {"id": "section-10-2", "number": "10.2", "title": "保形预测：加宽补哪一块", "content": "Split conformal（脚本 `calibrate_uq_p2.py`，套在 ensemble 的 \\(\\mu,\\sigma\\) 上，思想对 MC 同样适用）：\n\n\\[\ns_i=\\frac{|y_i-\\mu(x_i)|}{\\sigma(x_i)},\\quad\nq=\\mathrm{Quantile}_{\\lceil(n+1)(1-\\alpha)\\rceil/n}(\\{s_i\\})\n\\]\n\n\\[\nC(x)=[\\mu-q\\sigma,\\mu+q\\sigma]\n\\]\n\n\\(q>1.96\\) 就是**加宽**。在与校准集**可交换**的新样本上，有有限样本覆盖下界 \\(\\ge 1-\\alpha\\)。\n\n补：覆盖率校准这一层。  \n不补：激波位置、ReLU 对间断、fig14 的 \\(r\\approx 0.027\\)、分布漂移。Pareto 3× 与校准集不可交换，\\(q\\) 可以失效。  \n不代替 RANS 残差收敛，不把 0.9173 变成金属叶子。\n\n93.5–96.5% **未冻结**，禁止对外当结论。\n\n---"}, {"id": "section-10-3", "number": "10.3", "title": "三种收敛对照表", "content": "| 名字 | 在收敛的是什么 | 本项目 |\n|---|---|---|\n| MC 估计量 | \\(T\\to\\infty\\)，\\(\\hat\\mu,\\hat\\sigma\\to\\) Dropout 分布的矩 | \\(T=100\\) 够稳 |\n| 覆盖率校准 | \\(\\hat C\\to 1-\\alpha\\) | η 只有 65%，未校准 |\n| RANS 残差 | relrms 到阈值 | −3.39，未收敛 |\n\n生产端常数 \\(\\sigma\\)：所有 \\(x\\) 一样宽，更不是逐点校准。"}], "sections": [{"id": "practice-1", "title": "练习 1"}, {"id": "practice-2", "title": "练习 2"}, {"id": "practice-3", "title": "练习 3"}, {"id": "unit-test", "title": "单元卷"}], "questions": [{"id": "U10-S1-Q01", "section": "practice-1", "number": "Q01", "difficulty": "easy", "type": "choice", "stem": "\\(\\hat C_\\eta=\\)", "options": ["A. 0.95", "B. 0.89", "C. 0.65", "D. 0.88"], "answer": "C", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U10-S1-Q02", "section": "practice-1", "number": "Q02", "difficulty": "easy", "type": "choice", "stem": "65% 的意思是", "options": ["A. 模型 65 分", "B. 100 个真值里约 65 个落在各自带子里", "C. 准确率 65%", "D. T=65"], "answer": "B", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U10-S1-Q03", "section": "practice-1", "number": "Q03", "difficulty": "medium", "type": "fill", "stem": "外面大约 ______ 个点。", "options": null, "answer": "35", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U10-S1-Q04", "section": "practice-1", "number": "Q04", "difficulty": "medium", "type": "fill", "stem": "三个覆盖率：π ______，η ______，ṁ ______。", "options": null, "answer": "0.89；0.65；0.88", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U10-S1-Q05", "section": "practice-1", "number": "Q05", "difficulty": "medium", "type": "short", "stem": "η 最差的三条原因。", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U10-S1-Q06", "section": "practice-1", "number": "Q06", "difficulty": "medium", "type": "short", "stem": "「名义 95%」的名义是什么意思？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U10-S1-Q07", "section": "practice-1", "number": "Q07", "difficulty": "medium", "type": "short", "stem": "覆盖率校准收敛的判据。", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U10-S1-Q08", "section": "practice-1", "number": "Q08", "difficulty": "medium", "type": "short", "stem": "把「收得住」换成法定词。", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U10-S1-Q09", "section": "practice-1", "number": "Q09", "difficulty": "medium", "type": "short", "stem": "fig12 黑线穿出色带是什么点？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U10-S1-Q10", "section": "practice-1", "number": "Q10", "difficulty": "hard", "type": "short", "stem": "把 1.96 改成 3.0，覆盖率与宽度怎样？这叫校准吗？", "options": nu
