  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script>window.PAGE_DATA = {"id": "u02", "kind": "unit", "title": "第 2 单元 · 级与三个气动输出", "subtitle": "级与三个气动输出 · 本地学习", "intro": "代理网络吐出的三个数不是「AI 分数」，是压气机**一级**的三个气动性能。本单元把 \\(\\pi,\\eta,\\dot m\\) 钉死。\n\n---", "contentSections": [{"id": "section-2-1", "number": "2.1", "title": "画面：一级在干什么", "content": "轴流压气机由很多**级**串起来。一级 = 一排转子（跟着轴转）+ 通常还有一排静子（不转，把动能收回静压）。  \n本项目的对象是 NASA Rotor 37：**单独一排跨音速压气机转子**，公开基准，用来验 CFD 和方法，不是整台发动机。\n\n气从上游来，转子对它做功，下游的压强和温度升高，质量在连续通过。工程师至少要三个数才知道这级「干得怎么样」：\n\n| 符号 | 中文 | 本项目字段 | 直观 |\n|---|---|---|---|\n| \\(\\pi\\) | 总压比 | `Compression_ratio` | 出口总压 / 进口总压。大于 1 才是在压缩 |\n| \\(\\eta\\) | 等熵效率 | `Efficiency` | 实际压缩离「可逆绝热」有多远。\\(\\le 1\\) |\n| \\(\\dot m\\) | 质量流量 | `Massflow` | 每秒穿过的质量，单位 kg/s |\n\n**总压** \\(p_t\\)：把气流等熵地刹到静止时的压强。它包含静压和速度头。压气机吃的、吐的，性能上常用总压比，不是随随便便一个壁面静压比。\n\n**等熵**：可逆且与外界无热量交换。等熵压缩是理想参照：同样压比，等熵过程耗功最少（对压气机）或温升最小。  \n**等熵效率**（压气机常用总对总）：\n\n\\[\n\\eta = \\frac{\\text{等熵过程所需的滞止焓升}}{\\text{实际滞止焓升}}\n\\]\n\n实际有激波、分离、掺混，焓升更大，\\(\\eta<1\\)。热力学第二定律禁止 \\(\\eta>1\\)。这就是损失里 \\(\\eta\\le 1\\) 惩罚的来源——**边界**，不是把熵方程写进网络。\n\n本项目数据里 \\(\\eta\\) 只在大约 **0.045** 宽的窄带里变。所以它难拟合，训练时这一路损失权重是 **3**（压比 1，流量 1.5）。\n\n---"}, {"id": "section-2-2", "number": "2.2", "title": "操作：三个数在仓库里怎么出现", "content": "1. PLAID 对每个样本给了三个标量标签（来自人家的 RANS，不是我们算的）。  \n2. 特征工程之后写入 `plaid_rotor37_features.csv` 的三列。  \n3. 网络输出三维向量，经 `scaler_y_v2` 反标准化，变回原来的量纲。  \n4. 网页 `/predict` 三个卡片就是这三列。\n\n冻住的留出集 \\(R^2\\)（E2）：\n\n\\[\nR^2_\\pi=0.9844,\\quad R^2_\\eta=0.9561,\\quad R^2_{\\dot m}=0.9827\n\\]\n\n基线 MLP：0.9664 / 0.9132 / 0.9492。\\(\\eta\\) 仍然最差。\n\n代理 NSGA-II 在特征空间里搜到的端点（仍是 E2，不是叶子）：\n\n- \\(\\eta_\\max=0.9173097\\)，训练均值 \\(\\langle\\eta\\rangle=0.8703\\)，相对 +5.4%  \n- \\(\\dot m_\\max=21.7379\\,\\mathrm{kg/s}\\)，该点 \\(\\eta\\approx 0.873\\)  \n- \\(\\pi_\\max=2.1073413\\)\n\n约束：\\(\\pi\\ge 1.8\\)，\\(\\eta\\ge 0.84\\)。\n\n**质量流量**的操作定义：\n\n\\[\n\\dot m = \\int_{\\text{截面}} \\rho\\, \\mathbf{u}\\cdot\\mathbf{n}\\,dA\n\\]\n\n堵塞（choke）：喉部达到声速，再降背压 \\(\\dot m\\) 几乎不再增加。Rotor 37 公开叙事里，流量顶到约 21.74 kg/s 附近就是这个边。那边 \\(\\eta\\) 会掉——U04 用激波讲原因。\n\n---"}, {"id": "section-2-3", "number": "2.3", "title": "公式：总压比与效率不要混", "content": "进口总压 \\(p_{t1}\\)，出口总压 \\(p_{t2}\\)：\n\n\\[\n\\pi = \\frac{p_{t2}}{p_{t1}}\n\\]\n\n对量热完全气体，等熵关系 \\(p_t\\sim T_t^{\\gamma/(\\gamma-1)}\\)。压气机总对总等熵效率一种常用写法：\n\n\\[\n\\eta_{tt}=\\frac{\\pi^{(\\gamma-1)/\\gamma}-1}{T_{t2}/T_{t1}-1}\n\\]\n\n\\(\\gamma\\) 空气常取 1.4，于是 \\((\\gamma-1)/\\gamma=0.2857\\)。  \n预测页上那格「滞止焓升」用的是\n\n\\[\n\\Delta h_0 \\approx c_p T_{t1}\\big(\\pi^{0.2857}-1\\big),\\quad c_p=1.005\\,\\mathrm{kJ/(kg\\cdot K)},\\ T_{t1}=288.15\\,\\mathrm{K}\n\\]\n\n这是**等熵焓升的估计**，拿预测出来的 \\(\\pi\\) 代入，当页面参考。它\n\n- 不是网络的一个输出头；  \n- 不是欧拉方程被写进损失；  \n- 进口总温还被冻在 288.15 K，真实 Rotor 37 工况并不总是这个数。\n\n**边界**\n\n- 三个输出都是**气动标量**。没有应力、温度场约束、寿命、加工公差 → 不叫 MDO。  \n- 标签来自别人的 RANS，我们自己的 SU2 还没收敛，所以三个数的「真」是 E2 意义上的真（相对 PLAID 标签），不是 E4。"}], "sections": [{"id": "practice-1", "title": "练习 1"}, {"id": "practice-2", "title": "练习 2"}, {"id": "practice-3", "title": "练习 3"}, {"id": "unit-test", "title": "单元卷"}], "questions": [{"id": "U02-S1-Q01", "section": "practice-1", "number": "Q01", "difficulty": "easy", "type": "choice", "stem": "一级至少包含哪个旋转部件？", "options": ["A. 静子", "B. 转子", "C. 燃烧室", "D. 尾喷管"], "answer": "B", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U02-S1-Q02", "section": "practice-1", "number": "Q02", "difficulty": "easy", "type": "choice", "stem": "Rotor 37 是", "options": ["A. 整台发动机", "B. 整台压气机", "C. 单转子公开基准", "D. 涡轮级"], "answer": "C", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U02-S1-Q03", "section": "practice-1", "number": "Q03", "difficulty": "medium", "type": "fill", "stem": "\\(\\pi,\\eta,\\dot m\\) 的中文：______、______、______。", "options": null, "answer": "总压比、等熵效率、质量流量", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U02-S1-Q04", "section": "practice-1", "number": "Q04", "difficulty": "medium", "type": "fill", "stem": "数据里 \\(\\eta\\) 变化带宽大约 ______；训练时 \\(\\eta\\) 路权重是 ______。", "options": null, "answer": "0.045；3", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U02-S1-Q05", "section": "practice-1", "number": "Q05", "difficulty": "medium", "type": "short", "stem": "总压和静压差在哪一个「刹住」的思想实验？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U02-S1-Q06", "section": "practice-1", "number": "Q06", "difficulty": "medium", "type": "short", "stem": "为什么等熵过程是压气机效率的参照？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U02-S1-Q07", "section": "practice-1", "number": "Q07", "difficulty": "medium", "type": "short", "stem": "\\(\\eta>1\\) 违反哪一条？损失里如何表达（不要说 PINN）？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U02-S1-Q08", "section": "practice-1", "number": "Q08", "difficulty": "medium", "type": "short", "stem": "「总对总」两个「总」各指什么？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U02-S1-Q09", "section": "practice-1", "number": "Q09", "difficulty": "medium", "type": "short", "stem": "为什么不输出静压比当主指标？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U02-S1-Q10", "section": "practice-1", "number": "Q10", "difficulty": "hard", "type": "short", "stem": "\\(\\eta\\) 若被理解成「输出功/输入功」，和等熵效率差在哪？跨音速转子用哪个？ ### 练习 2.2", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U02-S2-Q01", "section": "practice-2", "number": "Q01", "difficulty": "easy", "type": "choice", "stem": "冻住的 \\(\\eta\\) 留出集 \\(R^2\\) 是", "options": ["A. 0.9132", "B. 0.9561", "C. 0.9844", "D. 0.9173"], "answer": "B", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U02-S2-Q02", "section": "practice-2", "number": "Q02", "difficulty": "easy", "type": "choice", "stem": "任务权重 \\(w\\) 是", "options": ["A. (1,1,1)", "B. (3,1,1.5)", "C. (1,3,1.5)", "D. (1.5,3,1)"], "answer": "C", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U02-S2-Q03", "section": "practice-2", "number": "Q03", "difficulty": "medium", "type": "fill", "stem": "\\(\\dot m_\\max\\approx\\)______ kg/s，该点 \\(\\eta\\approx\\)______。", "options": null, "answer": "21.74；0.873", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U02-S2-Q04", "section": "practice-2", "number": "Q04", "difficulty": "medium", "type": "fill", "stem": "+5.4% 的分母是训练均值 \\(\\langle\\eta\\rangle=\\)______。", "options": null, "answer": "0.8703", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U02-S2-Q05", "section": "practice-2", "number": "Q05", "difficulty": "medium", "type": "short", "stem": "NSGA-II 两个不等式约束。", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U02-S2-Q06", "section": "practice-2", "number": "Q06", "difficulty": "medium", "type": "short", "stem": "堵塞后再降背压，\\(\\dot m\\) 怎样？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U02-S2-Q07", "section": "practice-2", "number": "Q07", "difficulty": "medium", "type": "short", "stem": "标签来自谁的 RANS？我们的 SU2 能替代吗？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U02-S2-Q08", "section": "practice-2", "number": "Q08", "difficulty": "medium", "type": "short", "stem": "`scaler_y_v2` 干什么？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U02-S2-Q09", "section": "practice-2", "number": "Q09", "difficulty": "medium", "type": "short", "stem": "\\(\\eta\\) 的 \\(R^2\\) 最低却权重最高，是因果还是并存？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U02-S2-Q10", "section": "practice-2", "number": "Q10", "difficulty": "hard", "type": "short", "stem": "权重改成 [1,1,1]，哪个 \\(R^2\\) 掉得最明显？根据是带宽还是物理？ ### 练习 2.3", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U02-S3-Q01", "section": "practice-3", "number": "Q01", "difficulty": "easy", "type": "choice", "stem": "\\(\\pi\\) 的定义是", "options": ["A. 叶面静压均值比", "B. \\(p_{t2}/p_{t1}\\)", "C. 背压/进口静压", "D. \\(\\Omega/P\\)"], "answer": "B", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U02-S3-Q02",
