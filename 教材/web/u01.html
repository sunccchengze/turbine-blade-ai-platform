  <script>window.PAGE_DATA = {"id": "u01", "kind": "unit", "title": "第 1 单元 · 红线与证据等级", "subtitle": "红线与证据等级 · 本地学习", "intro": "本单元不讲叶片怎么转，先讲：**一句话能不能说，取决于它绑在哪一级证据上。**  \n郭老师若只问一句「你现在证明了什么」，答错等级比答错公式更糟。\n\n---", "contentSections": [{"id": "section-1-1", "number": "1.1", "title": "画面：同一件事，五档说法", "content": "想象桌上放着三样东西。\n\n1. 一张纸，写着「我想用代理模型筛叶片」。  \n2. 一个已经训好的 ONNX 文件，和一张留出集上的 \\(R^2\\) 表。  \n3. 一份 SU2 日志，残差掉到 \\(-3.39\\) 就停了。\n\n这三样说的都是「这个项目」，但它们不是同一档事实。把 2 说成「已经找到好叶片」，或把 3 说成「CFD 验证完了」，就是越档。\n\n**证据等级**（Evidence grade）是给每句结论盖的章：\n\n| 档 | 名字 | 这句话能靠什么站住 | 本项目例子 |\n|---|---|---|---|\n| E0 | 规划 | 打算做，还没做出数字 | 「下一步想改 CST」 |\n| E1 | 静态 | 文件、定义、接口在，不依赖一次训练运气 | 「74 维是统计量，不是设计变量」 |\n| E2 | 代理 / 统计 | 留出集、代理搜索、可复现脚本 | \\(R^2=0.9844\\)；\\(\\eta_\\max=0.9173\\) |\n| E3 | 求解器趋势 | 求解器跑过，但残差未到收敛阈值 | SU2 粗网格 \\(\\mathrm{relrms}=-3.39\\) |\n| E4 | 物理闭环 | 收敛 RANS（最好再加细网格/多点）核过排序或增益 | **现在没有。决策指标全是 null** |\n\n法定出处：`evidence/metrics.json`、`evidence/claims.yaml`、`docs/CLAIM_EVIDENCE.md`。  \n网站、信、教材、嘴，不许各写一套数。\n\n**拆词**\n\n- **留出集**（holdout）：训练时完全没见过的样本。本项目 \\(n=100\\)，`random_state=42`。  \n- **收敛**（这里指 RANS 残差收敛）：离散方程的残差降到事先定的阈值。不是「覆盖率收敛」，也不是「蒙特卡洛估计量收敛」。三种收敛到 U10 再钉死。  \n- **对外可写**：写进给老师的信、写进 About 页的句子。未冻结的数（融合 \\(R^2\\) 区间、conformal 93.5–96.5%、\\(100{,}000\\times\\)）列在 `do_not_freeze_until_reproduced`，教材当结论用就违规。\n\n---"}, {"id": "section-1-2", "number": "1.2", "title": "操作：一句话怎么对档", "content": "操作规程只有四步。\n\n1. 找出句子里的数字或动词（「找到了」「验证了」「优化了」）。  \n2. 问：这个动词的主语是代理，还是收敛的 RANS？  \n3. 去 `evidence/claims.yaml` 找有没有对应 `status: verified` 的条目。  \n4. 没有条目，或 `decision_metrics` 仍是 `null`，这句话就不能对外说满。\n\n例：\n\n| 句子 | 档 | 判 |\n|---|---|---|\n| 留出集上压比 \\(R^2=0.9844\\) | E2 | 可写，必须带 \\(n=100\\), seed=42 |\n| 代理最高效率约 0.9173，相对训练均值约 +5.4% | E2 | 可写，必须带「代理」「相对训练均值」 |\n| 找到了一片可制造的最优叶片 | — | 禁。没有几何旋钮，没有收敛 RANS |\n| 粗网格残差停在 −3.39 | E3 | 可写，必须带「未收敛」 |\n| 代理能正确排序设计 | E4 | 空。`spearman_rank` 现在是 null |\n\n**禁词表**（信、页、答辩、教材练习的「对外句」里禁止当现状）：\n\n多学科设计优化（在结构/热接入前）、可制造的 Pareto 最优叶片、校准的 95% 置信区间、PINN（除非说「不是」）、N-S 残差约束、全工况智能优化、把 Rotor 37 叫涡轮。\n\n站的对外名： **气动代理筛选站**。\n\n---"}, {"id": "section-1-3", "number": "1.3", "title": "本项目的仓库地图（你两周要摸的路径）", "content": "```text\nevidence/metrics.json          冻住的数\nevidence/claims.yaml           能对外说的句子\ndocs/郭老师发送包.md            信发出前的检查单\ndocs/暑期总结-致郭振东-发送正文.txt  粘贴进邮箱的正文\nbackend/models/surrogate_model.onnx\nnotebooks/04_residual_physics_model.ipynb\nbackend/scripts/calibrate_uq_p2.py\ndata/processed/pareto_front_solutions.csv\n```\n\n线上站按页记住功能，不要被标题带跑：\n\n| 页 | 它实际是 | 它不是 |\n|---|---|---|\n| `/predict` | 74 维滑块 → 三个气动标量 | 不是实时 MC Dropout（生产端常数 \\(\\sigma\\)） |\n| `/explore` | 两维切片 | 不是全设计空间的 CFD |\n| `/optimize` | 特征空间里的非支配点 | 不是可加工叶片 |\n| `/uq` | 启发式带子 | 不是校准 95% CI |\n| `/generate` | 库内近邻 | 不是扩散长新叶 |\n| `/about` | 四档历史，第三档 HERE | 不是已完成的场算子 |\n\n题型：每节 2 选 + 2 填 + 6 问；单元卷 6 选 + 6 填 + 18 问。"}], "sections": [{"id": "practice-1", "title": "练习 1"}, {"id": "practice-2", "title": "练习 2"}, {"id": "practice-3", "title": "练习 3"}, {"id": "unit-test", "title": "单元卷"}], "questions": [{"id": "U01-S1-Q01", "section": "practice-1", "number": "Q01", "difficulty": "easy", "type": "choice", "stem": "本项目当前有没有已冻结的 E4 数字？", "options": ["A. 有，Spearman 已填", "B. 有，粗网格 −3.39 就是 E4", "C. 没有，决策指标全是 null", "D. 没有，但 About 页可以先写上"], "answer": "C", "explanation": "没有 E4 数字。decision_metrics 全是 null。−3.39 只是 E3，未收敛。"}, {"id": "U01-S1-Q02", "section": "practice-1", "number": "Q02", "difficulty": "easy", "type": "choice", "stem": "留出集 \\(R^2=0.9844\\) 属于哪一档？", "options": ["A. E0", "B. E1", "C. E2", "D. E4"], "answer": "C", "explanation": "留出集 R² 属于 E2（代理/统计），不是收敛 RANS。"}, {"id": "U01-S1-Q03", "section": "practice-1", "number": "Q03", "difficulty": "medium", "type": "fill", "stem": "公开数字只允许出自目录 ______ 。", "options": null, "answer": "evidence/", "explanation": "公开数字只出自 evidence/。"}, {"id": "U01-S1-Q04", "section": "practice-1", "number": "Q04", "difficulty": "medium", "type": "fill", "stem": "SU2 粗网格 \\(\\mathrm{relrms}=\\)______，字段 `converged=`______。", "options": null, "answer": "−3.39；false", "explanation": "粗网格 relrms=−3.39，converged=false。"}, {"id": "U01-S1-Q05", "section": "practice-1", "number": "Q05", "difficulty": "medium", "type": "short", "stem": "把「SU2 已经跑过」自动升级成 E4，错在哪？", "options": null, "answer": "跑过 ≠ 残差到阈值。−3.39 是平台，converged=false，只能当 E3 趋势，不能当 E4。", "explanation": ""}, {"id": "U01-S1-Q06", "section": "practice-1", "number": "Q06", "difficulty": "medium", "type": "short", "stem": "留出集 \\(n=100\\) 和官方 test 200 是不是一套？官方 test 为何算不出 \\(R^2\\)？", "options": null, "answer": "不是一套。官方 test 200 组标签隐藏，无法算 R²。本项目 R² 来自随机留出 n=100、seed=42。", "explanation": ""}, {"id": "U01-S1-Q07", "section": "practice-1", "number": "Q07", "difficulty": "medium", "type": "short", "stem": "「规划里写了细网格」能不能当 E4？", "options": null, "answer": "不能。规划是 E0，不产生冻结数字。", "explanation": ""}, {"id": "U01-S1-Q08", "section": "practice-1", "number": "Q08", "difficulty": "medium", "type": "short", "stem": "同一句「效率提高了 5.4%」，怎样写是 E2，怎样写就假冒 E4？", "options": null, "answer": "E2：代理相对训练均值 +5.4%。假 E4：写成 CFD 证实效率提高 5.4%。", "explanation": ""}, {"id": "U01-S1-Q09", "section": "practice-1", "number": "Q09", "difficulty": "medium", "type": "short", "stem": "为什么网站、信、README 必须共用 `evidence/`？", "options": null, "answer": "单一事实源，避免网站、信、README 各写一套数。", "explanation": ""}, {"id": "U01-S1-Q10", "section": "practice-1", "number": "Q10", "difficulty": "hard", "type": "short", "stem": "有人建议把 E3 改名叫「已验证」。列出三条反对理由。 ### 练习 1.2（10 题）", "options": null, "answer": "①残差未到 −6；②一阶耗散大；③细网格没跑完。改名会诱使把趋势当验证。", "explanation": ""}, {"id": "U01-S2-Q01", "section": "practice-2", "number": "Q01", "difficulty": "easy", "type": "choice", "stem": "站的对外名称是", "options": ["A. 叶轮机械 MDO 平台", "B. 气动代理筛选站", "C. 可制造叶片优化站", "D. 全工况智能设计器"], "answer": "B", "explanation": "对外名称是气动代理筛选站。结构/热未接，不能叫 MDO。"}, {"id": "U01-S2-Q02", "section": "practice-2", "number": "Q02", "difficulty": "easy", "type": "choice", "stem": "下列哪句现在可以当现状对外说？", "options": ["A. 校准的 95% 置信区间", "B. 可制造的 Pareto 最优叶片", "C. 粗网格残差停在 −3.39，未收敛", "D. 已用 PINN 嵌入 N-S"], "answer": "C", "explanation": "C 带「未收敛」，是合规 E3。A/B/D 都在禁词表。"}, {"id": "U01-S2-Q03", "section": "practice-2", "number": "Q03", "difficulty": "medium", "type": "fill", "stem": "η 通道 MC Dropout 经验覆盖率是 ______%。", "options": null, "answer": "65", "explanation": "η 经验覆盖率 65%，名义 95%，未校准。"}, {"id": "U01-S2-Q04", "section": "practice-2", "number": "Q04", "difficulty": "medium", "type": "fill", "stem": "KIT 303 秒在叙事里是______（填「引子」或「本项目对象」）。", "options": null, "answer": "引子", "explanation": "KIT 303 秒是行业引子，对象是 Rotor 37。"}, {"id": "U01-S2-Q05", "section": "practice-2", "number": "Q05", "difficulty": "medium", "type": "short", "stem": "`status: empty` 的 claim 可以写进摘要吗？", "options": null, "answer": "不可以。只有 status: verified 才能对外写。", "explanation": ""}, {"id": "U01-S2-Q06", "section": "practice-2", "number": "Q06", "difficulty": "medium", "type": "short", "stem": "「代理筛路，物理定音」现在「定音」完成了没有？", "options": null, "answer": "没有。定音需要收敛 RANS。", "explanation": ""}, {"id": "U01-S2-Q07", "section": "practice-2", "number": "Q07", "difficulty": "medium", "type": "short", "stem": "把 Pareto 叫「最优叶片」至少错在哪两处？", "options": null, "answer": "至少两处：不是真实几何；没有收敛 RANS，不能叫最优可制造叶片。", "explanation": ""}, {"id": "U01-S2-Q08", "section": "practice-2", "number": "Q08", "difficulty": "medium", "type": "short", "stem": "给郭老师的信里点宋老师名字，纪律是什么？", "options": null, "answer": "给郭老师的信不点宋老师。", "explanation": "纪律是不点名，不是「经本人同意再点」。"}, {"id": "U01-S2-Q09", "section": "practice-2", "number": "Q09", "difficulty": "medium", "type": "short", "stem": "改错：「我们在 74 维设计空间里做了 MDO。」", "options": null, "answer": "改为：在 74 维特征空间里做了气动代理筛选。74 维不是设计空间，也还不是 MDO。", "explanation": ""}, {"id": "U01-S2-Q10", "section": "practice-2", "number": "Q10", "difficulty": "hard", "type": "short", "stem": "写一条「差一个词就从 E2 滑到假 E4」的句子并改正。 ### 练习 1.3（10 题）", "options": null, "answer": "错句：「找到最优叶片。」改正：「代理筛出最高效率候选 0.9173，未用收敛 RANS 核。」", "explanation": ""}, {"id": "U01-S3-Q01", "section": "practice-3", "number": "Q01", "difficulty": "easy", "type": "choice", "stem": "Rotor 37 是", "options": ["A. 涡轮静子", "B. 涡扇整机", "C. 跨音速压气机转子", "D. 实验台实测叶片"], "answer": "C", "explanation": "NASA Rotor 37 是跨音速压气机转子，不是涡轮。"}, {"id": "U01-S3-Q02", "section": "practice-3", "number": "Q02", "difficulty": "easy", "type": "choice", "stem": "`/generate` 页实际是", "options": ["A. 扩散模型长新叶", "B. 库内近邻检索", "C. CST 反设计", "D. 收敛 RANS"], "answer": "B", "explanation": "生成页是库内近邻检索，不是扩散长新叶。"}, {"id": "U01-S3-Q03", "section": "practice-3", "number": "Q03", "difficulty": "medium", "type": "fill", "stem": "生产端 UQ 用的是______（填「实时 100 次 Dropout」或「预计算常数 σ」）。", "options": null, "answer": "预计算常数 σ", "explanation": "生产 API 不是实时 100 次 Dropout。"}, {"id": "U01-S3-Q04", "section": "practice-3", "number": "Q04", "difficulty": "medium", "type": "fill", "stem": "E3 和 E4 的分界是残差有没有到______。", "options": null, "answer": "阈值", "explanation": "E3/E4 分界是残差有没有到收敛阈值，不是求解器有没有启动。"}, {"id": "U01-S3-Q05", "section": "practice-3", "number": "Q05", "difficulty": "medium", "type": "short", "stem": "「最高效率 0.9173」少哪两个限定词就不能对外说？", "options": null, "answer": "「代理」和「相对训练均值」（或「不是 CFD 叶片」）。", "explanation": ""}, {"id": "U01-S3-Q06", "section": "practice-3", "number": "Q06", "difficulty": "medium", "type": "short", "stem": "`decision_metrics` 为何全是 null？", "options": null, "answer": "没有收敛 RANS 对照，禁止用代理自比填决策指标。", "explanation": ""}, {"id": "U01-S3-Q07", "section": "practice-3", "number": "Q07", "difficulty": "medium", "type": "short", "stem": "信里写「PINN 约束了 N-S」为何违规？损失里实际有什么？", "options": null, "answer": "违规。损失只有输出边界 ReLU²，没有把 N-S 残差写进损失，不是 PINN。", "explanation": ""}, {"id": "U01-S3-Q08", "section": "practice-3", "number": "Q08", "difficulty": "medium", "type": "short", "stem": "结构、热都没接时为什么不能叫 MDO？", "options": null, "answer": "三个输出都是气动标量，结构/热/振动都没接。", "explanation": ""}, {"id": "U01-S3-Q09", "section": "practice-3", "number": "Q09", "difficulty": "medium", "type": "short", "stem": "`do_not_freeze` 里三类数各举一个。", "options": null, "answer": "融合 R² 区间；conformal 93.5–96.5%；100,000×（不含离线 1000 组 CFD）。", "explanation": ""}, {"id": "U01-S3-Q10", "section": "practice-3", "number": "Q10", "difficulty": "hard", "type": "short", "stem": "郭老师问：「你是不是已经做完气动优化了？」不超过三句、不越档。 ---", "options": null, "answer": "没有做完。只在特征空间用代理做了多目标筛选；没有可加工几何，也没有收敛 RANS。", "explanation": ""}, {"id": "U01-E-Q01", "section": "unit-test", "number": "Q01", "difficulty": "easy", "type": "choice", "stem": "E2 指", "options": ["A. 规划", "B. 静态定义", "C. 代理 / 统计", "D. 收敛 RANS"], "answer": "C", "explanation": "E2 = 代理/统计。"}, {"id": "U01-E-Q02", "section": "unit-test", "number": "Q02", "difficulty": "easy", "type": "choice", "stem": "决策指标现在是", "options": ["A. 已填 Spearman", "B. 全部 null", "C. 用代理自比填过", "D. 只填了 Top-k"], "answer": "B", "explanation": "决策指标全部 null。"}, {"id": "U01-E-Q03", "section": "unit-test", "number": "Q03", "difficulty": "easy", "type": "choice", "stem": "官方 test 200 组标签", "options": ["A. 公开，已报 \\(R^2\\)", "B. 隐藏，算不出 \\(R^2\\)", "C. 与 holdout 是同一 100 点", "D. 只有几何没有工况"], "answer": "B", "explanation": "官方 test 标签隐藏，算不出 R²。"}, {"id": "U01-E-Q04", "section": "unit-test", "number": "Q04", "difficulty": "easy", "type": "choice", "stem": "Rotor 37 载体", "options": ["A. 涡轮转子", "B. 压气机转子", "C. 风扇整级", "D. 燃烧室"], "answer": "B", "explanation": "压气机转子。"}, {"id": "U01-E-Q05", "section": "unit-test", "number": "Q05", "difficulty": "medium", "type": "choice", "stem": "生产 API 的 UQ", "options": ["A. 每个请求实时 100 次 Dropout", "B. 预计算常数 σ", "C. 已 conformal 校准", "D. 不用 σ"], "answer": "B", "explanation": "预计算常数 σ。"}, {"id": "U01-E-Q06", "section": "unit-test", "number": "Q06", "difficulty": "medium", "type": "choice", "stem": "生成页法定说法", "options": ["A. 扩散生成", "B. 库内近邻检索", "C. FFD 新叶", "D. 可加工 CAD"], "answer": "B", "explanation": "库内近邻检索。"}, {"id": "U01-E-Q07", "section": "unit-test", "number": "Q07", "difficulty": "easy", "type": "fill", "stem": "冻住 \\(R^2\\)：π = ______，η = ______，ṁ = ______。", "options": null, "answer": "0.9844 / 0.9561 / 0.9827", "explanation": "冻住的是这三数，不是 0.9608 / 0.9777。"}, {"id": "U01-E-Q08", "section": "unit-test", "number": "Q08", "difficulty": "easy", "type": "fill", "stem": "粗网格 relrms = ______，收敛了吗？______。", "options": null, "answer": "−3.39；否", "explanation": ""}, {"id": "U01-E-Q09", "section": "unit-test", "number": "Q09", "difficulty": "medium", "type": "fill", "stem": "站名：______。", "options": null, "answer": "气动代理筛选站", "explanation": ""}, {"id": "U01-E-Q10", "section": "unit-test", "number": "Q10", "difficulty": "medium", "type": "fill", "stem": "E3 句子三件套：粗网格 / 一阶 / ______。", "options": null, "answer": "未收敛", "explanation": "E3 三件套：粗网格 / 一阶 / 未收敛。"}, {"id": "U01-E-Q11", "section": "unit-test", "number": "Q11", "difficulty": "medium", "type": "fill", "stem": "三个气动输出符号：______、______、______。", "options": null, "answer": "π、η、ṁ", "explanation": ""}, {"id": "U01-E-Q12", "section": "unit-test", "number": "Q12", "difficulty": "medium", "type": "fill", "stem": "η 经验覆盖率 ______%；名义水平 ______%。", "options": null, "answer": "65；95", "explanation": ""}, {"id": "U01-E-Q13", "section": "unit-test", "number": "Q13", "difficulty": "medium", "type": "short", "stem": "holdout 和官方 test 为何不能混报 \\(R^2\\)？", "options": null, "answer": "划分不同；官方无标签，holdout 才是本项目 R² 口径。", "explanation": ""}, {"id": "U01-E-Q14", "section": "unit-test", "number": "Q14", "difficulty": "medium", "type": "short", "stem": "「0.9173」最低限定词清单。", "options": null, "answer": "代理；相对训练均值；不是 CFD 叶片。", "explanation": ""}, {"id": "U01-E-Q15", "section": "unit-test", "number": "Q15", "difficulty": "medium", "type": "short", "stem": "+5.4% 为何不能和季路成组 +1.2% 比？", "options": null, "answer": "一个是代理相对训练均值，一个是 CFD 核过的增益，证据档不同，不能比大小。", "explanation": ""}, {"id": "U01-E-Q16", "section": "unit-test", "number": "Q16", "difficulty": "medium", "type": "short", "stem": "C06、C07 各说什么？", "options": null, "answer": "C06：74 维是表面统计量，不是可设计几何。C07：三个输出均为气动标量，故不称 MDO。", "explanation": ""}, {"id": "U01-E-Q17", "section": "unit-test", "number": "Q17", "difficulty": "medium", "type": "short", "stem": "「物理约束」在本项目指什么、不指什么？", "options": null, "answer": "指输出盒子 ReLU² 惩罚。不指 N-S 残差，不是 PINN。", "explanation": ""}, {"id": "U01-E-Q18", "section": "unit-test", "number": "Q18", "difficulty": "medium", "type": "short", "stem": "加速比怎样写才不和 `do_not_freeze` 冲突？", "options": null, "answer": "写单点毫秒，并声明不含离线 1000 组 CFD。不要把 100,000× 当冻结结论。", "explanation": ""}, {"id": "U01-E-Q19", "section": "unit-test", "number": "Q19", "difficulty": "medium", "type": "short", "stem": "信里可以写 TNO 吗？可以写「我做了 TNO」吗？", "options": null, "answer": "可以引用郭老师 2025 TNO。不能写「我做了 TNO」。", "explanation": ""}, {"id": "U01-E-Q20", "section": "unit-test", "number": "Q20", "difficulty": "medium", "type": "short", "stem": "三维预览缺哪句话会骗过外行？", "options": null, "answer": "缺「示意，不是这个向量反解的 CAD」。", "explanation": ""}, {"id": "U01-E-Q21", "section": "unit-test", "number": "Q21", "difficulty": "medium", "type": "short", "stem": "特征空间和设计空间差在哪个可逆性？", "options": null, "answer": "特征→几何一般不可逆。", "explanation": ""}, {"id": "U01-E-Q22", "section": "unit-test", "number": "Q22", "difficulty": "medium", "type": "short", "stem": "为什么现在不能说「全工况」？", "options": null, "answer": "没有扫完整特性/非设计点。", "explanation": ""}, {"id": "U01-E-Q23", "section": "unit-test", "number": "Q23", "difficulty": "medium", "type": "short", "stem": "Reviewer 该读什么、不该读什么？", "options": null, "answer": "读原始输出和日志，不读作者摘要。", "explanation": ""}, {"id": "U01-E-Q24", "section": "unit-test", "number": "Q24", "difficulty": "medium", "type": "short", "stem": "别人要复现 0.9173，必须锁住哪几样？", "options": null, "answer": "seed、pymoo 0.6.1、numpy/onnxruntime 锁版、同脚本。", "explanation": ""}, {"id": "U01-E-Q25", "section": "unit-test", "number": "Q25", "difficulty": "medium", "type": "short", "stem": "指出错句：「粗网格跑通了，物理闭环完成了一半。」", "options": null, "answer": "「一半」暗示 E4 进度。粗网格未收敛不是闭环的一半。", "explanation": ""}, {"id": "U01-E-Q26", "section": "unit-test", "number": "Q26", "difficulty": "medium", "type": "short", "stem": "指出错句：「覆盖率 65% 说明模型只有 65 分。」", "options": null, "answer": "覆盖率是区间命中率，不是模型总分。", "explanation": ""}, {"id": "U01-E-Q27", "section": "unit-test", "number": "Q27", "difficulty": "medium", "type": "short", "stem": "未加定语的「收敛」容易和哪两种搅在一起？", "options": null, "answer": "MC 估计量收敛；覆盖率校准收敛。", "explanation": ""}, {"id": "U01-E-Q28", "section": "unit-test", "number": "Q28", "difficulty": "hard", "type": "short", "stem": "设计一道「越档检测」题并给标准答案。", "options": null, "answer": "自拟。须能抓住「代理结果冒充 CFD 验证」。", "explanation": ""}, {"id": "U01-E-Q29", "section": "unit-test", "number": "Q29", "difficulty": "hard", "type": "short", "stem": "郭老师看 About 30 秒：哪三行必须看见？哪三行有害？", "options": null, "answer": "必须看见：HERE 在标量筛选；η 覆盖 65%；−3.39 未收敛。有害：100,000× 当贡献；多学科；可制造最优。", "explanation": ""}, {"id": "U01-E-Q30", "section": "unit-test", "number": "Q30", "difficulty": "hard", "type": "short", "stem": "「想发 CJA」现在是 E 几？还缺的最小闭环不超过五条。", "options": null, "answer": "现在是 E2。缺 CST/FFD、收敛 RANS 对照、校准加点、决策指标、非设计点或缩结论。", "explanation": ""}]};</script>
