  <script>window.PAGE_DATA = {"id": "u12", "kind": "unit", "title": "第 12 单元 · Level 2 与郭老师线", "subtitle": "Level 2 与郭老师线 · 本地学习", "intro": "Q5 + 送信后的口答。本单元是全书收口。\n\n---", "contentSections": [{"id": "section-12-1", "number": "12.1", "title": "为什么现在不能叫 MDO", "content": "**MDO**（Multidisciplinary Design Optimization）：多个学科的模型耦合进同一个优化问题。气动 + 结构 + 热 + …  \n\n本项目三个输出都是气动标量。结构、热、振动、寿命、加工公差都没接。所以对外名称是 **气动代理筛选站**。\n\n「多目标」≠「多学科」。NSGA-II 同时动 \\(\\pi,\\eta,\\dot m\\) 仍是单学科里的多目标。\n\n---"}, {"id": "section-12-2", "number": "12.2", "title": "三个毕业等级与三块铁证", "content": "| 级 | 要有什么 | 现在 |\n|---|---|---|\n| 1 可信代理基准 | 严格划分、多种子、强基线、消融、校准 UQ | 未达到（单一种子留出） |\n| 2 物理闭环研究原型 | 几何可映射、合法性、Top-k RANS、排名对比、Trust Region、一次 AL | **现实目标** |\n| 3 可讨论论文贡献 | 非设计点或收缩结论、独立复现、样本效率、第二套数据 | 以后 |\n\n学长终态：知道自己何时可信、能输出真实几何、能接受 RANS 裁决、全过程可复现。\n\n**Level 2 三块铁证**（不会就不能自称 Level 2）：\n\n1. **真实几何旋钮**：CST / FFD / B 样条，能出合法叶子进求解器。  \n2. **Top-k RANS + 排名对比**：收敛残差，填 Spearman / Top-k Recall，禁止代理自比。  \n3. **一次主动学习或 abstain**：高 η 低 σ / 高 η 高 σ / 对照；或带宽过大就拒绝。回填看误差、UQ、前沿有没有动。\n\n做不到跨工况，就把结论缩到指定设计工况。\n\n---"}, {"id": "section-12-3", "number": "12.3", "title": "郭老师这条线，和你怎么开口", "content": "公开工作时间线（不是组内未发表材料）：\n\n```text\n多保真选数据集（2018 SMO，与 Haftka）\n  → 并行 MF-EI / EGO\n  → KT-EGO（高维）\n  → CLBO（NTU / Ong）\n  → 涡轮多保真与高维叶栅（2023）\n  → SDNO 气膜冷却算子（2024）\n  → TNO：Rotor 37 子午面先报 T,p,ρ 再报性能（2025 CJA 38(7):103473）\n```\n\n他问的是：少算几次真 CFD，空间能不能探清？  \n你停在标量残差 MLP + 离线 NSGA-II。能接上的接口是 **加点**：η 覆盖率 65% 当传感器。\n\n开口（不点宋老师）：\n\n「您 2018 年和 Haftka 老师问的是多保真该不该掺 LF。我现在卡在效率通道覆盖率只有 65%，想把这块当成加点传感器，先用几十次收敛 RANS 换一条能核的前沿。几何我改 CST。场预报我跟您 2025 年的 TNO 学，先不自己另做一套算子。」\n\n信：`docs/暑期总结-致郭振东-发送正文.txt`。检查单：`docs/郭老师发送包.md` 第 5 节十问，本单元卷会重打。\n\n不要：把 0.23 ms 当贡献；报代理 5.4% 当 CFD；没 CST 谈新叶型；平行去撞 GeoFunFlow。"}], "sections": [{"id": "practice-1", "title": "练习 1"}, {"id": "practice-2", "title": "练习 2"}, {"id": "practice-3", "title": "练习 3"}, {"id": "unit-test", "title": "单元卷"}], "questions": [{"id": "U12-S1-Q01", "section": "practice-1", "number": "Q01", "difficulty": "easy", "type": "choice", "stem": "站的对外名", "options": ["A. MDO 平台", "B. 气动代理筛选站", "C. 全工况优化器", "D. TNO 站"], "answer": "B", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U12-S1-Q02", "section": "practice-1", "number": "Q02", "difficulty": "easy", "type": "choice", "stem": "多目标等于多学科吗？", "options": ["A. 等于", "B. 不等于", "C. 有 NSGA-II 就等于", "D. 有三个输出就等于"], "answer": "B", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U12-S1-Q03", "section": "practice-1", "number": "Q03", "difficulty": "medium", "type": "fill", "stem": "MDO 四词：______。", "options": null, "answer": "Multidisciplinary Design Optimization", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U12-S1-Q04", "section": "practice-1", "number": "Q04", "difficulty": "medium", "type": "fill", "stem": "C07：三个输出均为______，故不称 MDO。", "options": null, "answer": "气动标量", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U12-S1-Q05", "section": "practice-1", "number": "Q05", "difficulty": "medium", "type": "short", "stem": "还缺哪些学科才配叫 MDO（至少三个）？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U12-S1-Q06", "section": "practice-1", "number": "Q06", "difficulty": "medium", "type": "short", "stem": "优化页曾写「多学科权衡」错在哪？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U12-S1-Q07", "section": "practice-1", "number": "Q07", "difficulty": "medium", "type": "short", "stem": "气动多目标优化的合法说法。", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U12-S1-Q08", "section": "practice-1", "number": "Q08", "difficulty": "medium", "type": "short", "stem": "改错：把「MDO 平台」当现状。", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U12-S1-Q09", "section": "practice-1", "number": "Q09", "difficulty": "medium", "type": "short", "stem": "热还没接就不能说气热耦合，为什么？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U12-S1-Q10", "section": "practice-1", "number": "Q10", "difficulty": "hard", "typ
