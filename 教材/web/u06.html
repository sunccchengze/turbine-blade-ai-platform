  <script>window.PAGE_DATA = {"id": "u06", "kind": "unit", "title": "第 6 单元 · 从三万点到 74 维", "subtitle": "从三万点到 74 维 · 本地学习", "intro": "本单元钉死学长和 Q1 的那句话：**74 维是全局统计约化，不是可加工的几何旋钮。**\n\n---", "contentSections": [{"id": "section-6-1", "number": "6.1", "title": "画面：三万个节点上有什么", "content": "每个 PLAID 样本，叶片表面大约 29,773 个节点。每个节点 9 个场量：\n\nCoordinateX, Y, Z；NormalsX, Y, Z；Pressure, Density, Temperature。\n\n这是一张离散的表面场，不是 74 个旋钮。若直接把 \\(29773\\times 9\\) 个数拉直，维数约 \\(2.7\\times 10^5\\)，样本只有 1000，必崩——这叫**维数灾难**（curse of dimensionality）：维度升高，体积指数膨胀，点与点的距离变得没有分辨力。\n\n---"}, {"id": "section-6-2", "number": "6.2", "title": "操作：九场 × 八统计 + 两个工况", "content": "对每一组场，在全部表面节点上算 8 个数：\n\n| 统计量 | 符号/名字 | 注意 |\n|---|---|---|\n| mean | 均值 | |\n| **std** | **标准差** | 不是方差。方差是 \\(\\mathrm{std}^2\\) |\n| min, max | 最小、最大 | |\n| p25, p75 | 第一、第三四分位 | |\n| skew | 偏度 | 分布左偏右偏的一个数，**不是**「激波在 70% 叶高」 |\n| kurt | 峰度 | 尾巴胖瘦的一个数 |\n\n\\(9\\times 8=72\\)，加上 \\(\\Omega,P\\) 得 **74**。  \n\\(\\Omega,P\\) 不是从三万点算出来的，是算例的工况。\n\n这是多对一映射：激波偏前、偏后，Pressure_mean 和 Pressure_skew 可以几乎一样。位置信息在这个映射的**核**里——被捏没了。\n\n偏度/峰度算完就留下两个标量，**不会**发回三万个点。\n\n---"}, {"id": "section-6-3", "number": "6.3", "title": "为什么这不是 CST / FFD", "content": "**设计变量**（design variable）：能生成合法几何、能进网格和求解器的参数。例如 CST 的权重、FFD 控制点、B 样条控制点、前缘半径、厚度。\n\n74 维里的 Pressure_skew 是流场的统计，铣床听不懂。NSGA-II 在这 74 维里搜，得到的是另一个 74 维向量，**不保证存在**一片叶子实现它，更不保证那片叶子合法、可加工。\n\n三维预览是示意重构，不是这个向量的逆映射。\n\n官方 test 200 组：几何和标签隐藏，只给工况。所以官方 test 上算不出 \\(R^2\\)。本项目 \\(R^2\\) 是随机留出 100 点，不是跨几何族泛化证明。"}], "sections": [{"id": "practice-1", "title": "练习 1"}, {"id": "practice-2", "title": "练习 2"}, {"id": "practice-3", "title": "练习 3"}, {"id": "unit-test", "title": "单元卷"}], "questions": [{"id": "U06-S1-Q01", "section": "practice-1", "number": "Q01", "difficulty": "easy", "type": "choice", "stem": "表面节点大约", "options": ["A. 74", "B. 1000", "C. 29773", "D. 52 万"], "answer": "C", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U06-S1-Q02", "section": "practice-1", "number": "Q02", "difficulty": "easy", "type": "choice", "stem": "直接拉直 \\(29773\\times9\\) 维会", "options": ["A. 更好训", "B. 维数灾难", "C. 变成 CST", "D. 自动收敛 RANS"], "answer": "B", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U06-S1-Q03", "section": "practice-1", "number": "Q03", "difficulty": "medium", "type": "fill", "stem": "九组场：坐标__、法向__、压密温。", "options": null, "answer": "3；3", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U06-S1-Q04", "section": "practice-1", "number": "Q04", "difficulty": "medium", "type": "fill", "stem": "\\(29773\\times9\\approx\\)______ 维。", "options": null, "answer": "\\(2.7\\times10^5\\)", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U06-S1-Q05", "section": "practice-1", "number": "Q05", "difficulty": "medium", "type": "short", "stem": "点云 2048 和 29773 是同一离散吗？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U06-S1-Q06", "section": "practice-1", "number": "Q06", "difficulty": "medium", "type": "short", "stem": "法向三分量描述什么？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U06-S1-Q07", "section": "practice-1", "number": "Q07", "difficulty": "medium", "type": "short", "stem": "坐标均值能当设计变量吗？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U06-S1-Q08", "section": "practice-1", "number": "Q08", "difficulty": "medium", "type": "short", "stem": "为何不直接训三万点？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U06-S1-Q09", "section": "practice-1", "number": "Q09", "difficulty": "medium", "type": "short", "stem": "场量和工况量来源差别。", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U06-S1-Q10", "section": "practice-1", "number": "Q10", "difficulty": "hard", "type": "short", "stem": "「两片几何不同、74 维几乎相同」的思想实验。", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U06-S2-Q01", "section": "practice-2", "number": "Q01", "difficulty": "easy", "type": "choice", "stem": "八个统计量里最容易说错成方差的是", "options": ["A. mean", "B. std", "C. skew", "D. kurt"], "answer": "B", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U06-S2-Q02", "section": "practice-2", "number": "Q02", "difficulty": "easy", "type": "choice", "stem": "72+2 来自", "options": ["A. 72 个 CST 权", "B. 9×8+Ω+P", "C. 36×2", "D. 官方 test"], "answer": "B", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U06-S2-Q03", "section": "practice-2", "number": "Q03", "difficulty": "medium", "type": "fill", "stem": "方差 = std 的______。", "options": null, "answer": "平方", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U06-S2-Q04", "section": "practice-2", "number": "Q04", "difficulty": "medium", "type": "fill", "stem": "Ω、P 是______（工况/统计量）。", "options": null, "answer": "工况", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U06-S2-Q05", "section": "practice-2", "number": "Q05", "difficulty": "medium", "type": "short", "stem": "偏度为什么不是「激波在 70% 叶高」？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U06-S2-Q06", "section": "practice-2", "number": "Q06", "difficulty": "medium", "type": "short", "stem": "这个映射的「核」指什么？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U06-S2-Q07", "section": "practice-2", "number": "Q07", "difficulty": "medium", "type": "short", "stem": "p25 的含义。", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U06-S2-Q08", "section": "practice-2", "number": "Q08", "difficulty": "medium", "type": "short", "stem": "统计完成后三万点还在输入里吗？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U06-S2-Q09", "section": "practice-2", "number": "Q09", "difficulty": "medium", "type": "short", "stem": "改错：「74 维就是 74 个可铣尺寸。」", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U06-S2-Q10", "section": "practice-2", "number": "Q10", "difficulty": "hard", "type": "short", "stem": "Pressure_std 大，除激波强外举一个混淆源。", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U06-S3-Q01", "section": "practice-3", "number": "Q01", "difficulty": "easy", "type": "choice", "stem": "CST/FFD 属于", "options": ["A. 统计量", "B. 设计变量家族", "C. 损失项", "D. ONNX 算子"], "answer": "B", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U06-S3-Q02", "section": "practice-3", "number": "Q02", "difficulty": "easy", "type": "choice", "stem": "官方 test 200 组标签", "options": ["A. 可见", "B. 隐藏", "C. 与 holdout 相同", "D. 只有 η"], "answer": "B", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U06-S3-Q03", "section": "practice-3", "number": "Q03", "difficulty": "medium", "type": "fill", "stem": "NSGA-II 搜索空间法定名称：______空间。", "options": null, "answer": "特征", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U06-S3-Q04", "section": "practice-3", "number": "Q04", "difficulty": "medium", "type": "fill", "stem": "三维预览是______，不是逆映射 CAD。", "options": null, "answer": "示意", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U06-S3-Q05", "section": "practice-3", "number": "Q05", "difficulty": "medium", "type": "short", "stem": "随机留出和跨几何族划分差在哪？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U06-S3-Q06", "section": "practice-3", "number": "Q06", "difficulty": "medium", "type": "short", "stem": "铣床听得懂前缘半径，听不懂什么？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U06-S3-Q07", "section": "practice-3", "number": "Q07", "difficulty": "medium", "type": "short", "stem": "C06 大意。", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U06-S3-Q08", "section": "practice-3", "number": "Q08", "difficulty": "medium", "type": "short", "stem": "PointNet/GNN 为何能保留空间信息？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U06-S3-Q09", "section": "practice-3", "number": "Q09", "difficulty": "medium", "type": "short", "stem": "融合 \\(R^2\\) 区间为何不能冻？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U06-S3-Q
