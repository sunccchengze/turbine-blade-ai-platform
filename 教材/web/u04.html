  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script>window.PAGE_DATA = {"id": "u04", "kind": "unit", "title": "第 4 单元 · 激波、附面层与 Rotor 37", "subtitle": "激波、附面层与 Rotor 37 · 本地学习", "intro": "![叶栅通道示意](../figures/U04-shock-bl.svg)\n\n本单元回答：为什么 \\(\\eta\\) 比 \\(\\pi\\)、\\(\\dot m\\) 难，为什么覆盖率在 \\(\\eta\\) 上只有 65%。\n\n---", "contentSections": [{"id": "section-4-1", "number": "4.1", "title": "激波", "content": "**激波**（shock）：超音速流里的压力陡坎。几个网格宽度内，压强猛升，马赫数掉到亚音，熵增加。它不是声波，不能当等熵波处理。\n\n正激波（来流垂直于波面）的压比、密度比由 Rankine–Hugoniot 关系定，随来流马赫数升高而变强。斜激波弱一些。叶栅通道里常见的是**槽道激波**（passage shock），往往略斜。\n\n波后：亚音、逆压梯度陡。这是后面附面层倒霉的原因。\n\n**不要说「基波」。** 那是口误。\n\n---"}, {"id": "section-4-2", "number": "4.2", "title": "附面层与激波–附面层干扰", "content": "**附面层**（boundary layer）：贴壁的薄粘性剪切层。壁面上速度 0（无滑移），向外很快恢复到主流。它不是涂层，也不是「负面层」。\n\n层流附面层摩阻小、抗逆压差；转捩后变湍流，更能抗分离，但掺混损失更大。跨音速转子吸力面（叶背，常凸、压力低）上，附面层本来就在逆压里爬。\n\n**激波–附面层干扰**（SWBLI）：激波的逆压梯度打在附面层上。附面层变厚，重则分离。分离泡里低能流体掺混，熵增跳升，**等熵效率对「激波站在弦向何处」极敏感**，接近间断响应。\n\n压力面（叶盆）压力高，是气流被折转造成的压差，不是「凹坑里气挤在一起」。\n\n**喉部**：相邻叶片通道最窄截面。堵塞发生在这里，不是燃烧室进口，也不是尾喷管。\n\n公开基准：叶尖 \\(M_\\mathrm{rel}\\approx 1.48\\)。代理最大流量点 \\(\\dot m\\approx 21.74\\,\\mathrm{kg/s}\\) 时 \\(\\eta\\approx 0.873\\)（相对最高效率点 0.9173 掉了一截）。**物理叙事**是：靠近堵塞，槽道激波增强，吸力面分离，\\(\\eta\\) 掉。  \n**证据等级**：\\(\\dot m\\) 和 \\(\\eta\\) 的配对是 E2（代理点）；「激波掀开附面层」是与公开 Rotor 37 机理一致的解释，**不是**我们收敛 RANS 在该点上拍到的场。信里可以当机理直觉讲，不能当 E4 照片讲。\n\n---"}, {"id": "section-4-3", "number": "4.3", "title": "Rotor 37 是谁，不是谁", "content": "NASA Rotor 37：上世纪高负荷进口级转子，Reid & Moore 等报告，后来成为 CFD 验证的公共考题。PLAID 提供 1000 组带标签的三维 RANS 变分样本（几何变 + 工况变）。\n\n- 它是**压气机转子**，不是涡轮，不是风扇整级，不是涡扇。  \n- KIT 无压气机氢燃机 303 秒是行业**引子**，不是本项目对象。  \n- 74 维统计把激波位置抹掉（U06）。所以网络用平滑函数贴一个接近跳的 \\(\\eta\\)，残差堆在跳附近，Dropout 抖权重也抖不出那根红线——这是 U09–U10 的伏笔。"}], "sections": [{"id": "practice-1", "title": "练习 1"}, {"id": "practice-2", "title": "练习 2"}, {"id": "practice-3", "title": "练习 3"}, {"id": "unit-test", "title": "单元卷"}], "questions": [{"id": "U04-S1-Q01", "section": "practice-1", "number": "Q01", "difficulty": "easy", "type": "choice", "stem": "正激波后马赫数", "options": ["A. 仍 >1", "B. =1", "C. <1", "D. 0"], "answer": "C", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U04-S1-Q02", "section": "practice-1", "number": "Q02", "difficulty": "easy", "type": "choice", "stem": "激波是", "options": ["A. 等熵波", "B. 增熵的压力陡坎", "C. 声波", "D. 接触间断"], "answer": "B", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U04-S1-Q03", "section": "practice-1", "number": "Q03", "difficulty": "medium", "type": "fill", "stem": "口误「基波」应改为______。", "options": null, "answer": "激波", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U04-S1-Q04", "section": "practice-1", "number": "Q04", "difficulty": "medium", "type": "fill", "stem": "叶栅里常见的是______激波（passage shock）。", "options": null, "answer": "槽道", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U04-S1-Q05", "section": "practice-1", "number": "Q05", "difficulty": "medium", "type": "short", "stem": "为何激波一定增熵？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U04-S1-Q06", "section": "practice-1", "number": "Q06", "difficulty": "medium", "type": "short", "stem": "槽道激波和孤立正激波差在哪？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U04-S1-Q07", "section": "practice-1", "number": "Q07", "difficulty": "medium", "type": "short", "stem": "波后逆压梯度从哪来？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U04-S1-Q08", "section": "practice-1", "number": "Q08", "difficulty": "medium", "type": "short", "stem": "斜激波为何通常比正激波弱？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U04-S1-Q09", "section": "practice-1", "number": "Q09", "difficulty": "medium", "type": "short", "stem": "来流 \\(M\\) 升高，正激波压比升还是降？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "explanation": ""}, {"id": "U04-S1-Q10", "section": "practice-1", "number": "Q10", "difficulty": "hard", "type": "short", "stem": "写出正激波压比公式并代入 \\(M=1.48\\)；为何叶栅不能直接用该数？", "options": null, "answer": "对照本节教材正文作答。标准数字只认 evidence/。", "expla
