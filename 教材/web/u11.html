  <script>window.PAGE_DATA = {"id": "u11", "kind": "unit", "title": "第 11 单元 · Pareto 与「数不是叶子」", "subtitle": "Pareto 与数不是叶子 · 本地学习", "intro": "Q3 正课。0.9173 是特征空间里代理吐的数。\n\n---", "contentSections": [{"id": "section-11-1", "number": "11.1", "title": "多目标与非支配", "content": "两个目标冲突：\\(\\eta\\) 要高，\\(\\dot m\\) 要大，往往不能同时最优。  \n**支配**：A 的所有目标都不差于 B，且至少一个更好。  \n**非支配 / Pareto 最优（在该点集里）**：没有点支配它。  \n**Pareto 前沿**：非支配点连成的权衡曲线。一头再涨，另一头必掉。\n\n不是「三头都最甜的一个点」。\n\nNSGA-II（Deb 2002）：非支配排序 + 拥挤距离 + 精英保留。本项目：种群 100，**200 代**，seed=42，pymoo 0.6.1 锁版。约束 \\(\\pi\\ge 1.8,\\eta\\ge 0.84\\)。得到 100 个非支配点（代理意义上）。\n\n版本漂移：pymoo 0.6.2 曾把 max η 漂到 0.9212。对外只用锁版 0.9173。\n\n---"}, {"id": "section-11-2", "number": "11.2", "title": "三个端点与物理叙事", "content": "| 端点 | 数 | 必须带的话 |\n|---|---|---|\n| 最高效率 | 0.9173097 | 代理；相对训练均值 0.8703 为 +5.4% |\n| 最大流量 | 21.7379 kg/s | 该点代理 η≈0.873 |\n| 最高压比 | 2.1073413 | 代理 |\n\n最大流量附近：公开机理是靠近堵塞，激波–分离，η 掉。E2 的是两个数的配对；激波场不是我们拍的。\n\n流形：到训练集最近邻中位距离约 17.4 vs 内部 6.1，约 3×。+5.4% 更像外推。\n\n不能和季路成组 CFD 核过的 +0.8%/+1.2% 比大小。\n\n---"}, {"id": "section-11-3", "number": "11.3", "title": "从向量到叶子缺哪些箭头", "content": "```text\n74 维向量\n  --缺-- 合法几何（CST/FFD）\n  --缺-- 体积网格\n  --缺-- 收敛 RANS\n  --缺-- 与基准的 CFD 对比\n  --缺-- 结构/热/加工\n→ 一片金属叶子\n```\n\n页上 3D 是示意重构，参数化预览，**不是**这个向量的逆 CAD。  \n生成页是库内近邻，不是扩散长新叶。  \n所以：不能说找到了一片好叶片。"}], "sections": [{"id": "practice-1", "title": "练习 1"}, {"id": "practice-2", "title": "练习 2"}, {"id": "practice-3", "title": "练习 3"}, {"id": "unit-test", "title": "单元卷"}], "questions": [{"id": "U11-S1-Q01", "section": "practice-1", "number": "Q01", "difficulty": "easy", "type": "choice", "stem": "本项目 NSGA-II", "options": ["A. 种群 100、20 代", "B. 种群 100、200 代", "C. 种群 200、100 代", "D. 单目标"], "answer": "B", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id": "U11-S1-Q02", "section": "practice-1", "number": "Q02", "difficulty": "easy", "type": "choice", "stem": "对外应用的 max η", "options": ["A. 0.9212", "B. 0.9173（锁版）", "C. 0.99", "D. 1.0"], "answer": "B", "explanation": "见教材配套答案详解 · 客观题键。"}, {"id
